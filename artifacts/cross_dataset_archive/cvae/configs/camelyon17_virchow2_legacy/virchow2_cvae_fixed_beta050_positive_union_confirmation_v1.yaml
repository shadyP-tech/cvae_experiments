experiment:
  name: virchow2_cvae_fixed_beta050_positive_union_confirmation_v1
  artifact_root: cvae_rebuild/artifacts/camelyon17_virchow2_legacy/virchow2_cvae_fixed_beta050_positive_union_confirmation_v1
  primary_variant: pca64_beta001

inputs:
  feature_cache_root: cvae_rebuild/artifacts/camelyon17_virchow2_legacy/pathology_embeddings/virchow2
  repair_artifact_root: cvae_rebuild/artifacts/camelyon17_virchow2_legacy/virchow2_cvae_preservation_repair_v1
  paired_dense_artifact_root: cvae_rebuild/artifacts/camelyon17_virchow2_legacy/virchow2_cvae_paired_dense_all4_reliability_confirmation_v1
  mass_bagged_artifact_root: cvae_rebuild/artifacts/camelyon17_virchow2_legacy/virchow2_cvae_decentralized_component_union_mass_bagged_v1
  shrink050_artifact_root: cvae_rebuild/artifacts/camelyon17_virchow2_legacy/virchow2_cvae_decentralized_component_union_reliability_shrink050_v1
  source_union_gmm_artifact_root: cvae_rebuild/artifacts/camelyon17_virchow2_legacy/virchow2_cvae_source_union_gmm_prior_v1
  balanced_gmm_artifact_root: cvae_rebuild/artifacts/camelyon17_virchow2_legacy/virchow2_cvae_source_union_center_balanced_gmm_prior_v1
  prior_tailrisk_artifact_root: cvae_rebuild/artifacts/camelyon17_virchow2_legacy/virchow2_cvae_component_union_tailrisk_anchored_mass_bagged_v1
  development_positive_union_artifact_root: cvae_rebuild/artifacts/camelyon17_virchow2_legacy/virchow2_cvae_source_inner_class_conditional_positive_union_v1
  support_calibrated_artifact_root:
  backbone: virchow2

run_matrix:
  strict_full_run_matrix: true
  experiment_seeds: [45, 46, 47, 48, 49]
  heldout_centers: ["0", "1", "2", "3", "4"]
  replicate_seeds: [17, 23, 31]
  fresh_replicate_seeds: [101, 103, 107, 109, 113, 127]

generation:
  synthetic_per_class_total: 128
  min_per_source_per_class: 8

fixed_beta050_positive_union_confirmation:
  primary_method: fixed_beta050_positive_union_confirmation_v1
  primary_shrink_lambda: 0.5
  random_mass_bag_size: 11
  random_mass_bag_alpha: 4.0
  blend_alpha: 0.5
  matched_shuffled_reliability_null_permutations: 0
  panel_seed_groups:
    canonical: [17, 23, 31]
    fresh_a: [101, 103, 107]
    fresh_b: [109, 113, 127]
  candidate_pooling_rules:
    - arithmetic_mean
    - positive_union_beta025
    - positive_union_beta050
    - positive_union_beta100
  fixed_pooling_rule: positive_union_beta050
  fixed_beta: 0.5
  development_experiment_seeds: [42, 43, 44]
  primary_confirmation_experiment_seeds: [45, 46, 47, 48, 49]
  positive_label: 1
  prediction_threshold: 0.5
  min_source_inner_positive_count: 5
  positive_union_eps: 1.0e-8
  rare_positive_count_threshold: 10
  rare_positive_prevalence_threshold: 0.05
  source_inner_bacc_noninferiority_margin: 0.010
  source_inner_class0_recall_margin: 0.015
  source_inner_predicted_positive_rate_delta: 0.050
  beta100_class0_recall_margin: 0.005
  beta100_precision_margin: 0.010
  candidate_components_per_source_class: [4, 3, 2, 1]
  min_samples_per_component: 8
  source_weighting: fixed_beta050_positive_union_confirmation
  gmm_covariance_type: diag
  gmm_reg_covar: 1.0e-4
  gmm_n_init: 1
  gmm_max_iter: 100
  min_component_weight: 0.02
  variance_floor: 1.0e-5
  variance_ceiling_multiplier: 16.0
  primary_pooling: fixed_global_positive_union_beta050
  reliability_floor_score: 0.05
  reliability_epsilon: 1.0e-8
  anchor_repro_tolerance: 1.0e-4
  primary_noninferiority_margin: 0.005
  weak_pass_noninferiority_margin: 0.010
  tailrisk_transfer_threshold: -0.010

classifier:
  type: sklearn_logistic_regression
  solver: lbfgs
  C: 1.0
  max_iter: 2000
  class_weight: balanced
  classifier_seed:
