[project]
name = "cvae-rebuild"
version = "0.1.0"
description = "Virchow2-CVAE rebuild with unlabeled target-support NELBO routing."
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "PyYAML",
  "scikit-learn",
  "torch",
]

[project.scripts]
cvae-rebuild = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "artifact_table_specs",
  "cli",
  "cli_registry",
  "component_union_mass_bagged",
  "component_union_rows",
  "component_union_tailrisk_anchored_mass_bagged",
  "component_union_tailrisk_artifacts",
  "config",
  "config_sections",
  "covariance_prior",
  "covariance_shrinkage",
  "covariance_viability",
  "decentralized_adaptive_gmm_prior",
  "decentralized_component_union_artifacts",
  "decentralized_component_union_prior",
  "decentralized_k16_gmm_prior",
  "decentralized_pruned_adaptive_equal_all4_prior",
  "decentralized_reliability_top3_gmm_prior",
  "decentralized_reliability_weighted_gmm_prior",
  "decentralized_source_inner_transfer_top3_gmm_prior",
  "decentralized_support8_top3_tau05_gmm_prior",
  "decentralized_support_nelbo_reliability_artifacts",
  "decentralized_support_nelbo_reliability_gmm_prior",
  "decision_markdown",
  "dense_reliability_tailshield_random_mass_bag",
  "domain_regime",
  "evaluation",
  "experts",
  "feature_frame",
  "features",
  "labeled_support_policy_calibration_artifacts",
  "labeled_support_random_vs_dense_policy_calibration",
  "metrics",
  "paired_component_coverage_audit",
  "paired_dense_all4_reliability_confirmation",
  "pipeline",
  "preservation",
  "preservation_repair",
  "preservation_sampling",
  "prior_calibration",
  "protocol",
  "reporting",
  "smoke",
  "source_inner_harmful_source_suppression",
  "source_inner_positive_union_selection",
  "source_inner_validated_dense_component_hybrid",
  "source_union_balanced_gmm_prior",
  "source_union_gmm_prior",
  "source_union_k24_gmm_prior",
  "splits",
  "support_calibrated_component_union_prior",
  "support_nelbo",
  "support_policy_rows",
  "support_split_rows",
  "target_support_regime_risk_gated_component_union",
  "target_support_risk_gate_artifacts",
  "train",
]

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "artifacts",
  "artifacts.*",
  "core",
  "core.*",
  "downstream",
  "downstream.*",
  "experiments",
  "experiments.*",
  "generation",
  "generation.*",
  "latent",
  "latent.*",
  "models",
  "models.*",
  "priors",
  "priors.*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
