experiment:
  name: virchow2_cvae_covariance_shrinkage_stability_v1
  artifact_root: cvae_rebuild/artifacts/virchow2_cvae_covariance_shrinkage_stability_v1
  primary_variant: pca64_beta001
  min_decision_cells: 9

inputs:
  feature_cache_root: sail/artifacts/pathology_embeddings/virchow2
  repair_artifact_root: cvae_rebuild/artifacts/virchow2_cvae_preservation_repair_v1
  sampling_artifact_root: cvae_rebuild/artifacts/virchow2_cvae_pca64_sampling_continuation_v1
  prior_calibration_artifact_root: cvae_rebuild/artifacts/virchow2_cvae_latent_prior_calibration_v1
  covariance_confirmation_artifact_root: cvae_rebuild/artifacts/virchow2_cvae_covariance_prior_confirmation_v1
  covariance_viability_artifact_root: cvae_rebuild/artifacts/virchow2_cvae_covariance_prior_viability_audit_v1
  backbone: virchow2

run_matrix:
  experiment_seeds: [42, 43, 44]
  heldout_centers: ["0", "1", "2", "3", "4"]
  replicate_seeds: [17, 23, 31]

generation:
  synthetic_per_class_total: 128

covariance_shrinkage:
  primary_method: cvae_cc_cov_diag_shrinkage075_prior_sample
  primary_covariance_shrinkage_alpha: 0.75
  diagnostic_covariance_shrinkage_alphas: [0.50, 0.90]
  reference_covariance_shrinkage_alpha: 0.10
  diagonal_reference_alpha: 1.00
  covariance_eigenvalue_floor: 1.0e-4
  full_cov_min_records_per_class: 32
  fallback_if_under_ranked: diag
  standard_prior_repro_abs_tol_bacc: 1.0e-6
  diag_prior_repro_abs_tol_bacc: 1.0
  alpha010_repro_abs_tol_bacc: 1.0e-6

classifier:
  type: sklearn_logistic_regression
  solver: lbfgs
  C: 1.0
  max_iter: 2000
  class_weight: balanced
  classifier_seed: null
