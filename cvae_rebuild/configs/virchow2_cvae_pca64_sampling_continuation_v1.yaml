experiment:
  name: virchow2_cvae_pca64_sampling_continuation_v1
  artifact_root: cvae_rebuild/artifacts/virchow2_cvae_pca64_sampling_continuation_v1
  primary_variant: pca64_beta001
  min_decision_cells: 10

inputs:
  feature_cache_root: sail/artifacts/pathology_embeddings/virchow2
  repair_artifact_root: cvae_rebuild/artifacts/virchow2_cvae_preservation_repair_v1
  backbone: virchow2

run_matrix:
  experiment_seeds: [42, 43, 44]
  heldout_centers: ["0", "1", "2", "3", "4"]
  replicate_seeds: [17, 23, 31]

generation:
  synthetic_per_class_total: 128

sampling:
  posterior_temperatures_primary: [1.0]
  posterior_temperatures_diagnostic: [0.25, 0.5]
  prior_scales_primary: [1.0]
  prior_scales_diagnostic: [0.25, 0.5]
  empirical_posterior_temperature: 1.0

classifier:
  type: sklearn_logistic_regression
  solver: lbfgs
  C: 1.0
  max_iter: 2000
  class_weight: balanced
  classifier_seed: null
