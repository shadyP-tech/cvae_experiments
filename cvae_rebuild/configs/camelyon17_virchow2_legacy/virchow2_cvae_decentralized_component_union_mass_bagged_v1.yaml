experiment:
  name: virchow2_cvae_decentralized_component_union_mass_bagged_v1
  artifact_root: cvae_rebuild/artifacts/camelyon17_virchow2_legacy/virchow2_cvae_decentralized_component_union_mass_bagged_v1
  primary_variant: pca64_beta001

inputs:
  feature_cache_root: cvae_rebuild/artifacts/camelyon17_virchow2_legacy/pathology_embeddings/virchow2
  repair_artifact_root: cvae_rebuild/artifacts/camelyon17_virchow2_legacy/virchow2_cvae_preservation_repair_v1
  paired_dense_artifact_root: cvae_rebuild/artifacts/camelyon17_virchow2_legacy/virchow2_cvae_paired_dense_all4_reliability_confirmation_v1
  component_union_v2_artifact_root: cvae_rebuild/artifacts/camelyon17_virchow2_legacy/virchow2_cvae_decentralized_component_union_reliability_shrink025_v2
  hybrid_artifact_root: cvae_rebuild/artifacts/camelyon17_virchow2_legacy/virchow2_cvae_source_inner_validated_dense_component_hybrid_v1
  source_union_gmm_artifact_root: cvae_rebuild/artifacts/camelyon17_virchow2_legacy/virchow2_cvae_source_union_gmm_prior_v1
  balanced_gmm_artifact_root: cvae_rebuild/artifacts/camelyon17_virchow2_legacy/virchow2_cvae_source_union_center_balanced_gmm_prior_v1
  backbone: virchow2

run_matrix:
  strict_full_run_matrix: true
  experiment_seeds: [42, 43, 44]
  heldout_centers: ["0", "1", "2", "3", "4"]
  replicate_seeds: [17, 23, 31]

generation:
  synthetic_per_class_total: 128
  min_per_source_per_class: 8

mass_bagged_component_union:
  primary_method: decentralized_component_union_mass_uncertainty_bagged_v1
  primary_bag_members:
    - uniform_source_mass
    - reliability_shrink_0.25
    - reliability_shrink_0.50
    - dirichlet_uniform_alpha4_perm000
    - dirichlet_uniform_alpha4_perm001
    - dirichlet_uniform_alpha4_perm002
    - dirichlet_uniform_alpha4_perm003
    - dirichlet_reliability025_alpha16_perm000
    - dirichlet_reliability025_alpha16_perm001
    - dirichlet_reliability025_alpha16_perm002
    - dirichlet_reliability025_alpha16_perm003
  control_bag_size: 11
  candidate_components_per_source_class: [4, 3, 2, 1]
  min_samples_per_component: 12
  source_weighting: mass_uncertainty_bagged_source_component_union
  gmm_covariance_type: diag
  gmm_reg_covar: 1.0e-4
  gmm_n_init: 5
  gmm_max_iter: 500
  min_component_weight: 0.02
  variance_floor: 1.0e-5
  variance_ceiling_multiplier: 16.0
  primary_pooling: arithmetic_probability_ensemble
  reliability_floor_score: 0.05
  reliability_epsilon: 1.0e-8
  shrink_lambdas: [0.25, 0.5]
  anchor_repro_tolerance: 1.0e-4

classifier:
  type: sklearn_logistic_regression
  solver: lbfgs
  C: 1.0
  max_iter: 2000
  class_weight: balanced
  classifier_seed: null
