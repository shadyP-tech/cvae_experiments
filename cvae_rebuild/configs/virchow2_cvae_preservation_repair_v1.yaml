experiment:
  name: virchow2_cvae_preservation_repair_v1
  artifact_root: cvae_rebuild/artifacts/virchow2_cvae_preservation_repair_v1
  primary_variant: pca64_beta001
  min_decision_rows: 10

inputs:
  feature_cache_root: cvae_rebuild/artifacts/pathology_embeddings/virchow2
  backbone: virchow2

run_matrix:
  experiment_seeds: [42, 43, 44]
  heldout_centers: ["0", "1", "2", "3", "4"]
  replicate_seeds: [17, 23, 31]

generation:
  synthetic_per_class_total: 128

classifier:
  type: sklearn_logistic_regression
  solver: lbfgs
  C: 1.0
  max_iter: 2000
  class_weight: balanced
  classifier_seed: null

source_probe:
  type: torch_linear_classifier
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 50
  batch_size: 128
  class_weight: balanced
  early_stopping: false

variants:
  - variant_id: current_pca200_beta1_reference
    expert_pool_type: per_source
    requested_pca_dim: 256
    hidden_dim: 512
    latent_dim: 64
    num_hidden_layers: 2
    train_epochs: 25
    batch_size: 128
    learning_rate: 0.001
    optimizer: adam
    weight_decay: 0.0
    gradient_clip_norm: 5.0
    beta_final: 1.0
    kl_warmup_epochs: 1
    probe_ce_weight: 0.0
    loss_style: legacy_sum_mse_kl
    selection_source: reference_only

  - variant_id: pca64_beta001
    expert_pool_type: per_source
    requested_pca_dim: 64
    hidden_dim: 512
    latent_dim: 16
    num_hidden_layers: 2
    train_epochs: 100
    batch_size: 128
    learning_rate: 0.001
    optimizer: adamw
    weight_decay: 0.0001
    gradient_clip_norm: 5.0
    beta_final: 0.001
    kl_warmup_epochs: 25
    probe_ce_weight: 0.0
    loss_style: normalized_repair
    selection_source: primary

  - variant_id: pca128_beta001
    expert_pool_type: per_source
    requested_pca_dim: 128
    hidden_dim: 512
    latent_dim: 32
    num_hidden_layers: 2
    train_epochs: 100
    batch_size: 128
    learning_rate: 0.001
    optimizer: adamw
    weight_decay: 0.0001
    gradient_clip_norm: 5.0
    beta_final: 0.001
    kl_warmup_epochs: 25
    probe_ce_weight: 0.0
    loss_style: normalized_repair
    selection_source: diagnostic_only

  - variant_id: pca64_beta001_probe025
