experiment:
  name: virchow2_cvae_source_union_k24_gmm_prior_v1
  artifact_root: cvae_rebuild/artifacts/virchow2_cvae_source_union_k24_gmm_prior_v1
  primary_variant: source_union_pca64_beta001_diagnostic

inputs:
  feature_cache_root: cvae_rebuild/artifacts/pathology_embeddings/virchow2
  repair_artifact_root: cvae_rebuild/artifacts/virchow2_cvae_preservation_repair_v1
  sampling_artifact_root: cvae_rebuild/artifacts/virchow2_cvae_pca64_sampling_continuation_v1
  prior_calibration_artifact_root: cvae_rebuild/artifacts/virchow2_cvae_latent_prior_calibration_v1
  covariance_confirmation_artifact_root: cvae_rebuild/artifacts/virchow2_cvae_covariance_prior_confirmation_v1
  source_union_gmm_artifact_root: cvae_rebuild/artifacts/virchow2_cvae_source_union_gmm_prior_v1
  balanced_gmm_artifact_root: cvae_rebuild/artifacts/virchow2_cvae_source_union_center_balanced_gmm_prior_v1
  backbone: virchow2

run_matrix:
  experiment_seeds: [42, 43, 44]
  heldout_centers: ["0", "1", "2", "3", "4"]
  replicate_seeds: [17, 23, 31]

generation:
  synthetic_per_class_total: 128

k24_gmm_prior:
  primary_method: source_union_cc_diag_gmm_k24_prior_sample
  gmm_components: 24
  gmm_covariance_type: diag
  gmm_reg_covar: 1.0e-4
  gmm_n_init: 5
  gmm_max_iter: 500
  gmm_weight_floor: 0.005
  min_class_train_count: 240
  min_effective_gmm_components: 12
  min_train_count_per_effective_component: 12
  posterior_noise_scale: 0.0
  diagnostic_gmm_components: [20, 32]
  budget256_synthetic_per_class_total: 256
  center_cap_samples_per_center_class: 128

classifier:
  type: sklearn_logistic_regression
  solver: lbfgs
  C: 1.0
  max_iter: 2000
  class_weight: balanced
  classifier_seed: null
