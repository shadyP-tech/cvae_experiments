experiment:
  name: family_c3_rich_latent_sampler_downstream_v1
  stage: downstream_generation_quality_diagnostic
  status: ready_for_family_c2_synced_artifacts
  dataset: camelyon17
  smoke: false
  primary_question: >
    Does preserving source-train class-conditional posterior structure improve
    synthetic embedding utility beyond a single fitted Gaussian latent prior?

protocol:
  split_regime: LOQDO
  support_eval_separation: required
  target_expert_exclusion: required
  source_experts_frozen: required
  posterior_bank_fit_split: source_train
  support_labels_for_routing: forbidden
  target_support_labels_used_for_generation: 0
  target_eval_embeddings_used_for_generation: 0
  target_eval_labels_for_training: forbidden
  target_eval_labels_for_final_metric_only: required
  target_mode_oracle_used_for_selection: 0
  target_expert_oracle_used_for_selection: 0
  sampler_release_level: per_sample_posterior_bank
  sampler_privacy_role: internal_diagnostic_only
  routing_artifact_source: family_c_label_marginal_support_nelbo_v1
  c2_comparison_source: family_c2_fitted_latent_prior_downstream_v1

inputs:
  family_c_run_root: cvae_testing/outputs/camelyon17/camelyon17_label_marginal_support_nelbo_v1/family_c_cam17_label_marginal_s42
  family_c_reports_dir: cvae_testing/outputs/camelyon17/camelyon17_label_marginal_support_nelbo_v1/family_c_cam17_label_marginal_s42/reports
  family_c_standard_artifacts_root: cvae_downstream_evaluation/artifacts/family_c_label_conditioned_downstream_v1
  family_c2_artifacts_root: cvae_downstream_evaluation/artifacts/family_c2_fitted_latent_prior_downstream_v1
  checkpoints_dir: cvae_testing/outputs/camelyon17/camelyon17_label_marginal_support_nelbo_v1/family_c_cam17_label_marginal_s42/checkpoints
  train_cache: cvae_testing/outputs/camelyon17/camelyon17_label_marginal_support_nelbo_v1/family_c_cam17_label_marginal_s42/embeddings/train.pt
  val_cache: cvae_testing/outputs/camelyon17/camelyon17_label_marginal_support_nelbo_v1/family_c_cam17_label_marginal_s42/embeddings/val.pt
  test_cache: cvae_testing/outputs/camelyon17/camelyon17_label_marginal_support_nelbo_v1/family_c_cam17_label_marginal_s42/embeddings/test.pt

routing:
  primary_selected_method: family_c3_source_transfer_sampler_expert_prior
  support_sizes: [4, 8, 16, 32]
  support_seeds: [17, 23, 31]

generation:
  modes:
    - class_conditional_posterior_stratified_bootstrap_mu
    - class_conditional_posterior_stratified_bootstrap_t1
    - class_conditional_gmm_mu_diag_bic
  mode_tie_break_order:
    - class_conditional_posterior_stratified_bootstrap_mu
    - class_conditional_posterior_stratified_bootstrap_t1
    - class_conditional_gmm_mu_diag_bic
  label_field: label
  label_values: [0, 1]
  label_semantics:
    0: normal_non_tumor
    1: tumor
  input_dim: 768
  hidden_dim: 256
  latent_dim: 16
  class_condition_dim: 2
  budget_per_class: 128
  generation_seeds: [17, 23, 31]
  duplicate_eps: 0.000001
  posterior_bank:
    fit_split: source_train
    min_source_train_per_class: 16
    fallback: unavailable
    sampler_release_level: per_sample_posterior_bank
  bootstrap:
    mu_temperature: 0.0
    t1_temperature: 1.0
  gmm:
    covariance_type: diag
    k_candidates: [1, 2, 4]
    selection: bic
    reg_covar: 0.0001
    min_component_weight: 0.000001
    mark_unavailable_if_not_converged: true

downstream:
  primary_track: synthetic_only
  classifier:
    family: sklearn_logistic_regression
    scaler_fit: synthetic_train_only
    solver: lbfgs
    C: 1.0
    max_iter: 2000
    class_weight: null
    hyperparameter_tuning: forbidden
  classifier_seeds: [17, 23, 31]
  primary_metrics:
    - bacc
    - macro_f1
  secondary_metrics:
    - auroc
    - auprc
  metric_validity:
    require_both_target_eval_classes: true

preflight:
  require:
    expert_family: family_c_label_conditioned_v1
    condition_type: class_label_one_hot
    class_condition_dim: 2
    label_values: [0, 1]
    input_dim: 768
    latent_dim: 16
    feature_extractor_name: dinov2_vitb14
    feature_extractor_checkpoint: facebook/dinov2-base
    beta_kl_weight: 1.0
    reconstruction_loss: mse_sum
    target_expert_excluded: true
    support_eval_disjoint: true
    support_labels_used_for_routing: 0

artifacts:
  root: cvae_downstream_evaluation/artifacts/family_c3_rich_latent_sampler_downstream_v1
  required_outputs:
    - manifests/family_c3_generation_manifest.csv
    - manifests/family_c3_trained_classifier_manifest.csv
    - tables/family_c3_posterior_bank_provenance.csv
    - tables/family_c3_sampler_diagnostics.csv
    - tables/family_c3_gmm_prior_diagnostics.csv
    - tables/family_c3_all_expert_downstream_matrix.csv
    - tables/family_c3_downstream_selection_alignment.csv
    - tables/family_c3_downstream_baseline_comparison.csv
    - tables/family_c3_source_transfer_sampler_prior_audit.csv
    - tables/family_c3_fixed_expert_generation_mode_comparison.csv
    - tables/family_c3_selected_policy_comparison.csv
    - reports/family_c3_downstream_protocol_audit.csv
    - reports/family_c3_downstream_decision_summary.json

decision_rule:
  primary_method: family_c3_source_transfer_sampler_expert_prior
  use_center_level_values: true
  downstream_strong:
    min_center_level_bacc: 0.80
    min_bacc_improvement_vs_c2: 0.01
    max_allowed_oracle_gap_worsening: 0.005
  generation_oracle_strong:
    min_fixed_single_expert_oracle_center_level_bacc: 0.80
  generation_improved:
    min_bacc_improvement_vs_c2: 0.005
    oracle_gap_must_not_worsen: true

claim_boundary:
  allowed: >
    Richer source-train class-conditional latent sampling can improve synthetic
    embedding utility for independently trained label-conditioned CVAE experts.
  forbidden: >
    Do not claim C3 proves full medical image generation quality, improves
    support-NELBO routing, or satisfies privacy release requirements for
    posterior-bank samplers.
