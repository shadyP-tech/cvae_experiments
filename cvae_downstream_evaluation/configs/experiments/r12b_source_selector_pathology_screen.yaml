experiment:
  name: r12b_source_selector_pathology_screen
  stage: source_only_compatibility_selector_audit
  status: audit_only
  thesis_chapter: 6
  primary_question: >
    Can source-only compatibility estimation select a pathology embedding
    configuration whose target utility approaches the posthoc target-eval
    ceiling?

protocol:
  split_regime: LOQDO
  audit_only: true
  retrain_cvae_experts: forbidden
  routing_tweak: forbidden
  embedding_extraction: external_frozen_cache
  target_eval_tuned_deployable_selection: forbidden
  posthoc_best_rows: audit_only
  source_inner_lodo_selected_rows: deployable_diagnostic
  target_train_rows: non_deployable
  same_camelyon17_rebuild_after_target_eval_selection: exploratory_rebuild_only

datasets:
  camelyon17:
    enabled: true
    domain_key: center
    candidate_centers: [0, 1, 2, 3, 4]
    experiment_seeds: [42, 43, 44]
    support_sizes: [4, 8, 16, 32]
    support_seeds: [17, 23, 31]
    eval_split: test

backbones:
  requested:
    - phikon
    - uni
    - virchow2

representations:
  requested:
    - raw
    - PCA64
    - PCA128
    - PCA256
  pca_dims: [64, 128, 256]
  pca_fit_scope: classifier_train_rows_only
  pca_low_sample_warning_multiplier: 3

classifier:
  primary:
    family: sklearn_logistic_regression
    scaler: StandardScaler
    solver: lbfgs
    C: 1.0
    max_iter: 2000
    class_weight: null
    random_state: experiment_seed
    hyperparameter_tuning: forbidden

source_inner_lodo:
  row_role_candidate: source_inner_lodo_candidate
  row_role_selected: source_inner_lodo_selected
  selector_centers: source_centers_only
  C_grid: [0.01, 0.1, 1.0, 10.0]
  class_weight_grid: [null, balanced]
  pca_grid: [raw, 64, 128, 256]
  selection_metric: source_inner_lodo_robust_score
  robust_penalty_weights: [0.0, 0.5, 1.0]
  primary_robust_penalty_weight: 0.5
  weak_center_threshold: 0.85
  emit_candidate_target_eval_rows: true
  target_labels_used_for_selection: false

diagnostics:
  diagnostics_used_for_selection: false
  diagnostics_used_for_decision_labels: false
  mmd_space: source_fitted_standard_scaler_then_optional_pca
  mmd_pca_dim_policy: min_64_n_source_minus_1_embedding_dim
  mmd_bandwidth: median_pairwise_distance_on_source_subset
  mmd_max_samples_per_domain: 2000
  mmd_seed: 12017

inputs:
  support_selection_glob: cvae_testing/outputs/camelyon17/camelyon17_support_estimated_utility_routing_v2/support_utility_v2_seed*/reports/support_response_sample_selections.csv
  expected_support_run_root: cvae_testing/outputs/camelyon17/camelyon17_support_estimated_utility_routing_v2
  expected_support_run_dir_pattern: support_utility_v2_seed{seed}
  cache_root: cvae_downstream_evaluation/artifacts/r12b_source_selector_pathology_screen/pathology_embeddings
  cache_path_template: "{cache_root}/{backbone}/seed{seed}/embeddings/{split}.pt"
  z11_reference_table: cvae_downstream_evaluation/artifacts/tables/z11_real_feature_ceiling_matrix.csv
  z11_reference_representation: PCA64

artifacts:
  root: cvae_downstream_evaluation/artifacts/r12b_source_selector_pathology_screen
  required_outputs:
    - tables/r12b_embedding_cache_fingerprint.csv
    - tables/r12b_real_feature_ceiling_matrix.csv
    - tables/r12b_source_inner_lodo_selection_matrix.csv
    - tables/r12b_pca_capacity_matrix.csv
    - tables/r12b_representation_shift_diagnostics.csv
    - tables/r12b_center_summary.csv
    - tables/r12b_backbone_ranking.csv
    - tables/r12b_selector_oracle_gap.csv
    - tables/r12b_class_weight_diagnostics.csv
    - manifests/r12b_protocol_manifest.json
    - reports/r12b_leakage_report.json
    - reports/r12b_decision_report.md

decision_rule:
  chance_bacc: 0.50
  audit_mean_bacc: 0.90
  audit_centers_ge_threshold: 0.85
  audit_min_centers_ge_threshold: 4
  rebuild_mean_bacc: 0.88
  rebuild_worst_center_bacc: 0.85
  mean_gain_threshold: 0.03
  weak_center_gain_threshold: 0.05
  no_mean_gain_threshold: 0.03
  selector_gap_improvement_threshold: 0.02
  selector_rank_threshold: 3
  seed_std_mean_bacc_max: 0.015
  seed_worst_center_min: 0.82

claim_boundary:
  allowed: >
    R1.2b can support whether source-only compatibility estimation can select
    pathology embedding configurations whose target utility approaches the
    posthoc ceiling.
  forbidden: >
    Do not claim a deployable same-Camelyon17 method from posthoc target-eval
    ranking or sensitivity-only robust-penalty diagnostics.
