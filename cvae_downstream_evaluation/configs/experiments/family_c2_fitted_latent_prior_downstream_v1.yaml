experiment:
  name: family_c2_fitted_latent_prior_downstream_v1
  stage: second_stage_downstream_generation_quality_upgrade
  status: ready_for_family_c_synced_artifacts
  dataset: camelyon17
  smoke: false
  primary_question: >
    Do source-train fitted class-conditional latent priors improve synthetic
    embedding utility for frozen, independently trained Family C CVAE experts?

protocol:
  split_regime: LOQDO
  support_eval_separation: required
  target_expert_exclusion: required
  source_experts_frozen: required
  latent_prior_fit_split: source_train
  support_labels_for_routing: forbidden
  target_support_labels_used_for_coral: 0
  target_eval_embeddings_used_for_coral: 0
  target_eval_labels_for_training: forbidden
  target_eval_labels_for_final_metric_only: required
  downstream_oracle_role: diagnostic_only
  routing_artifact_source: family_c_label_marginal_support_nelbo_v1
  standard_normal_comparison_source: family_c_label_conditioned_downstream_v1

inputs:
  family_c_run_root: cvae_testing/outputs/camelyon17/camelyon17_label_marginal_support_nelbo_v1/family_c_cam17_label_marginal_s42
  family_c_reports_dir: cvae_testing/outputs/camelyon17/camelyon17_label_marginal_support_nelbo_v1/family_c_cam17_label_marginal_s42/reports
  family_c_standard_artifacts_root: cvae_downstream_evaluation/artifacts/family_c_label_conditioned_downstream_v1
  checkpoints_dir: cvae_testing/outputs/camelyon17/camelyon17_label_marginal_support_nelbo_v1/family_c_cam17_label_marginal_s42/checkpoints
  train_cache: cvae_testing/outputs/camelyon17/camelyon17_label_marginal_support_nelbo_v1/family_c_cam17_label_marginal_s42/embeddings/train.pt
  val_cache: cvae_testing/outputs/camelyon17/camelyon17_label_marginal_support_nelbo_v1/family_c_cam17_label_marginal_s42/embeddings/val.pt
  test_cache: cvae_testing/outputs/camelyon17/camelyon17_label_marginal_support_nelbo_v1/family_c_cam17_label_marginal_s42/embeddings/test.pt
  required_family_c_reports:
    - label_marginal_decision_table.csv
    - label_marginal_support_nelbo_rows.csv
    - label_conditioned_checkpoint_provenance.csv
    - label_marginal_protocol_audit.csv

routing:
  primary_selected_method: family_c_source_transfer_downstream_prior
  imported_methods:
    - family_c_label_marginal
    - family_c_label_marginal_source_global_laplace
    - metadata_routing
    - random_expert_floor
    - source_global_static_expert
    - static_embedding_mean_distance
    - family_a_direct_support_nelbo_selection
  support_sizes: [4, 8, 16, 32]
  support_seeds: [17, 23, 31]

generation:
  primary_mode: class_conditional_fitted_latent_prior_sampling
  sensitivity_mode: class_conditional_fitted_latent_prior_support_coral
  label_field: label
  label_values: [0, 1]
  label_semantics:
    0: normal_non_tumor
    1: tumor
  input_dim: 768
  hidden_dim: 256
  latent_dim: 16
  class_condition_dim: 2
  budget_per_class: 128
  generation_seeds: [17, 23, 31]
  latent_prior:
    fit_split: source_train
    family: diagonal_gaussian_aggregated_posterior
    min_source_train_per_class_for_prior: 16
    var_clip_min: 0.0001
    var_clip_max: 25.0
    fallback: unavailable
  support_coral:
    role: sensitivity_only
    alignment: global_mean_covariance
    class_wise_alignment: forbidden
    target_support_labels_used_for_coral: 0
    target_eval_embeddings_used_for_coral: 0
    coral_regularization_eps: 0.001
    coral_max_condition_number: 100000000.0

downstream:
  primary_track: synthetic_only
  classifier:
    family: sklearn_logistic_regression
    scaler_fit: synthetic_train_only
    solver: lbfgs
    C: 1.0
    max_iter: 2000
    class_weight: null
    hyperparameter_tuning: forbidden
  classifier_seeds: [17, 23, 31]
  primary_metrics:
    - bacc
    - macro_f1
  secondary_metrics:
    - auroc
    - auprc
  metric_validity:
    require_both_target_eval_classes: true

preflight:
  require:
    expert_family: family_c_label_conditioned_v1
    condition_type: class_label_one_hot
    class_condition_dim: 2
    label_values: [0, 1]
    input_dim: 768
    latent_dim: 16
    feature_extractor_name: dinov2_vitb14
    feature_extractor_checkpoint: facebook/dinov2-base
    beta_kl_weight: 1.0
    reconstruction_loss: mse_sum
    target_expert_excluded: true
    support_eval_disjoint: true
    support_labels_used_for_routing: 0

artifacts:
  root: cvae_downstream_evaluation/artifacts/family_c2_fitted_latent_prior_downstream_v1
  required_outputs:
    - manifests/family_c2_downstream_generation_manifest.csv
    - manifests/family_c2_trained_classifier_manifest.csv
    - tables/family_c2_all_expert_downstream_matrix.csv
    - tables/family_c2_downstream_selection_alignment.csv
    - tables/family_c2_downstream_baseline_comparison.csv
    - tables/family_c2_latent_prior_provenance.csv
    - tables/family_c2_latent_prior_diagnostics.csv
    - tables/family_c2_support_coral_audit.csv
    - tables/family_c2_generation_mode_comparison.csv
    - tables/family_c2_downstream_fidelity_diagnostics.csv
    - tables/family_c2_label_controllability_diagnostics.csv
    - reports/family_c2_downstream_protocol_audit.csv
    - reports/family_c2_downstream_decision_summary.json

decision_rule:
  primary_method: family_c_source_transfer_downstream_prior
  use_center_level_values: true
  downstream_pass:
    min_center_level_bacc: 0.70
    min_bacc_improvement_vs_standard_normal: 0.005
    max_allowed_oracle_gap_worsening: 0.005
  oracle_strong:
    min_single_expert_oracle_center_level_bacc: 0.80

claim_boundary:
  allowed: >
    Learned source-train latent priors improve synthetic embedding utility for
    independently trained label-conditioned CVAE experts.
  forbidden: >
    Do not claim C2 improves support-NELBO routing or proves full medical image
    generation quality.
