experiment:
  name: z11_current_setup_ceiling_audit
  stage: current_setup_ceiling_audit
  status: audit_only
  thesis_chapter: 6
  primary_question: >
    Does the current Camelyon17 DINOv2/PCA/CVAE setup support a 0.90
    balanced-accuracy ceiling, or is utility lost in source transfer, PCA
    capacity, CVAE preservation, or weak-center domain shift?

protocol:
  split_regime: LOQDO
  audit_only: true
  retrain_cvae_experts: forbidden
  target_eval_tuned_deployable_selection: forbidden
  target_train_rows: non_deployable
  source_only_rows: audit_only
  posthoc_best_over_pca_dims: audit_only
  c63_predeclared_rows: deployable_if_synced_and_predeclared

datasets:
  camelyon17:
    enabled: true
    domain_key: center
    candidate_centers: [0, 1, 2, 3, 4]
    experiment_seeds: [42, 43, 44]
    support_sizes: [4, 8, 16, 32]
    support_seeds: [17, 23, 31]
    eval_split: test

representations:
  primary_predeclared: PCA64
  requested:
    - raw
    - PCA64
    - PCA64_reconstruction
    - PCA128
    - PCA256
  pca_dims: [64, 128, 256]
  pca_fit_scope: classifier_train_rows_only
  pca_low_sample_warning_multiplier: 3

classifier:
  primary:
    family: sklearn_logistic_regression
    scaler: StandardScaler
    solver: lbfgs
    C: 1.0
    max_iter: 2000
    class_weight: null
    random_state: experiment_seed
    hyperparameter_tuning: forbidden

inputs:
  support_selection_glob: cvae_testing/outputs/camelyon17/camelyon17_support_estimated_utility_routing_v2/support_utility_v2_seed*/reports/support_response_sample_selections.csv
  expected_support_run_root: cvae_testing/outputs/camelyon17/camelyon17_support_estimated_utility_routing_v2
  expected_support_run_dir_pattern: support_utility_v2_seed{seed}
  synthetic_evidence_globs:
    - cvae_downstream_evaluation/artifacts/tables/*c63*.csv
    - cvae_downstream_evaluation/artifacts/**/c63*.csv
    - cvae_testing/results/comparison_tables/**/*c63*.csv

artifacts:
  root: cvae_downstream_evaluation/artifacts
  required_outputs:
    - tables/z11_feature_tensor_fingerprint.csv
    - tables/z11_real_feature_ceiling_matrix.csv
    - tables/z11_pca_capacity_ceiling_matrix.csv
    - tables/z11_synthetic_preservation_gap.csv
    - tables/z11_center_summary.csv
    - manifests/z11_protocol_manifest.json
    - reports/z11_leakage_report.json
    - reports/z11_decision_report.md

decision_rule:
  chance_bacc: 0.50
  feasible_mean_bacc: 0.90
  feasible_worst_center_bacc: 0.85
  source_transfer_gap: 0.05
  pca_mean_gain: 0.02
  pca_weak_center_gain: 0.03
  preservation_ratio_min: 0.70

claim_boundary:
  allowed: >
    Z1.1 can support or reject feasibility of a 0.90 BACC target under the
    current representation/protocol and identify the most likely bottleneck.
  forbidden: >
    Do not treat target-trained diagnostics, post-hoc PCA choices, or missing
    synthetic evidence as deployable improvements.
