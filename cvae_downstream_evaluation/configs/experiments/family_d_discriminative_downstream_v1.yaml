experiment:
  name: family_d_discriminative_downstream_v1
  dataset: camelyon17
  stage: discriminative_label_conditioned_synthetic_downstream
  status: ready_for_family_d_checkpoints
  primary_question: >
    Does discriminative label-conditioned CVAE training improve synthetic
    embedding utility for independently trained source experts?

protocol:
  split_regime: LOQDO
  support_eval_separation: required
  target_expert_exclusion: required
  expert_family: family_d_discriminative_label_conditioned_v1
  expert_training_split: source_train
  expert_validation_split: source_val
  target_labels_used_for_training: 0
  target_eval_labels_used_for_training: 0
  target_eval_labels_used_for_final_metric_only: 1
  target_oracle_used_for_selection: 0
  early_stopping_metric: source_val_total_loss
  downstream_oracle_role: diagnostic_only
  claim_scope: synthetic_embedding_utility_only

inputs:
  family_c_reports_dir: cvae_testing/outputs/camelyon17/camelyon17_label_marginal_support_nelbo_v1/family_c_cam17_label_marginal_s42/reports
  family_d_reports_dir: cvae_testing/outputs/camelyon17/family_d_discriminative_label_conditioned_cvae_v1/family_d_cam17_discriminative_s42/reports
  family_d_checkpoints_dir: cvae_testing/outputs/camelyon17/family_d_discriminative_label_conditioned_cvae_v1/family_d_cam17_discriminative_s42/checkpoints
  c2_artifacts_root: cvae_downstream_evaluation/artifacts/family_c2_fitted_latent_prior_downstream_v1
  c3_artifacts_root: cvae_downstream_evaluation/artifacts/family_c3_rich_latent_sampler_downstream_v1
  train_cache: cvae_testing/outputs/camelyon17/camelyon17_label_marginal_support_nelbo_v1/family_c_cam17_label_marginal_s42/embeddings/train.pt
  val_cache: cvae_testing/outputs/camelyon17/camelyon17_label_marginal_support_nelbo_v1/family_c_cam17_label_marginal_s42/embeddings/val.pt
  test_cache: cvae_testing/outputs/camelyon17/camelyon17_label_marginal_support_nelbo_v1/family_c_cam17_label_marginal_s42/embeddings/test.pt

routing:
  primary_selected_method: family_d_source_transfer_downstream_prior
  imported_family_c_methods:
    - family_c_label_marginal
    - family_c_label_marginal_source_global_laplace
    - metadata_routing
    - random_expert_floor
    - source_global_static_expert
    - static_embedding_mean_distance
  support_sizes: [4, 8, 16, 32]
  support_seeds: [17, 23, 31]

generation:
  primary_mode: family_d_class_conditional_fitted_latent_prior_sampling
  label_field: label
  label_values: [0, 1]
  label_semantics:
    0: normal_non_tumor
    1: tumor
  input_dim: 768
  hidden_dim: 256
  latent_dim: 16
  class_condition_dim: 2
  budget_per_class: 128
  generation_seeds: [17, 23, 31]
  latent_prior:
    fit_split: source_train
    family: diagonal_gaussian_aggregated_posterior
    min_source_train_per_class_for_prior: 16
    var_clip_min: 0.0001
    var_clip_max: 25.0
    fallback: unavailable

downstream:
  primary_track: synthetic_only
  classifier:
    family: sklearn_logistic_regression
    scaler_fit: synthetic_train_only
    solver: lbfgs
    C: 1.0
    max_iter: 2000
    class_weight: null
    hyperparameter_tuning: forbidden
  classifier_seeds: [17, 23, 31]
  primary_metrics:
    - bacc
    - macro_f1

preflight:
  require:
    expert_family: family_d_discriminative_label_conditioned_v1
    condition_type: class_label_one_hot
    discriminative_training_enabled: 1
    class_condition_dim: 2
    label_values: [0, 1]
    input_dim: 768
    latent_dim: 16
    feature_extractor_name: dinov2_vitb14
    feature_extractor_checkpoint: facebook/dinov2-base
    beta_kl_weight: 1.0
    reconstruction_loss: mse_sum
    early_stopping_metric: source_val_total_loss

artifacts:
  root: cvae_downstream_evaluation/artifacts/family_d_discriminative_downstream_v1
  required_outputs:
    - manifests/family_d_downstream_generation_manifest.csv
    - manifests/family_d_trained_classifier_manifest.csv
    - tables/family_d_all_expert_downstream_matrix.csv
    - tables/family_d_downstream_selection_alignment.csv
    - tables/family_d_downstream_baseline_comparison.csv
    - tables/family_d_source_transfer_prior_audit.csv
    - tables/family_d_latent_prior_provenance.csv
    - tables/family_d_latent_prior_diagnostics.csv
    - reports/family_d_downstream_protocol_audit.csv
    - reports/family_d_downstream_decision_summary.json

decision_rule:
  primary_decision_hierarchy:
    - fixed_expert_oracle_improvement
    - selected_source_transfer_bacc
    - selector_oracle_gap
  downstream_strong:
    selected_center_level_mean_bacc_min: 0.80
    selected_center_level_delta_vs_c2_min: 0.02
    max_allowed_oracle_gap_worsening_vs_c2: 0.005
  generation_improved_oracle:
    fixed_expert_oracle_delta_vs_c2_min: 0.01
    max_source_val_nelbo_relative_worsening_vs_family_c: 0.10
  oracle_strong:
    family_d_fixed_expert_oracle_center_level_bacc_min: 0.80

claim_boundary:
  allowed: >
    Discriminative label-conditioned CVAE training can improve synthetic
    embedding utility for independently trained source experts.
  forbidden: >
    Do not claim Family D improves support-NELBO routing, proves full medical
    image realism, or uses target labels for training or selection.
