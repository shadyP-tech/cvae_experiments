# Legacy R1.2c-V config retained for SAIL extraction provenance only.
# Active runs must use sail/configs/sail_virchow2.yaml.

experiment:
  name: r12c_virchow2_dense_config_aggregation
  stage: virchow2_source_selected_dense_real_feature_audit
  status: audit_only
  thesis_chapter: 6
  primary_question: >
    Does Virchow2-only source-selected top-k config aggregation repair weak-center
    instability enough to justify a vanilla Virchow2 CVAE rebuild?

protocol:
  split_regime: LOQDO
  audit_only: true
  primary_backbone: virchow2
  target_eval_labels_used_for_scoring_only: true
  target_eval_tuned_deployable_selection: forbidden
  source_temperature: audit_only
  cross_backbone_aggregation: audit_only
  retrain_cvae_experts: forbidden
  embedding_extraction: external_frozen_cache
  same_camelyon17_rebuild_after_target_eval_selection: forbidden

datasets:
  camelyon17:
    enabled: true
    domain_key: center
    candidate_centers: [0, 1, 2, 3, 4]
    experiment_seeds: [42, 43, 44]
    support_sizes: [4, 8, 16, 32]
    support_seeds: [17, 23, 31]
    eval_split: test

dense_aggregation:
  primary_backbone: virchow2
  audit_backbones: [phikon, uni, virchow2]
  fixed_k_values: [1, 3, 5, 10]
  primary_k_values: [3, 5, 10]
  aggregation_rules: [geometric, arithmetic]
  audit_calibration_rules: [none, source_temperature]
  primary_calibration_rules: [none]
  temperature_grid: [0.5, 0.75, 1.0, 1.5, 2.0]
  pca_low_sample_warning_multiplier: 3
  robust_score:
    weak_center_threshold: 0.85
    std_weight: 0.25
    weak_penalty_weight: 0.50

inputs:
  r12b_config_path: cvae_downstream_evaluation/configs/experiments/r12b_source_selector_pathology_screen.yaml
  r12b_artifacts_root: cvae_downstream_evaluation/artifacts/r12b_source_selector_pathology_screen

artifacts:
  root: cvae_downstream_evaluation/artifacts/r12c_virchow2_dense_config_aggregation
  required_outputs:
    - tables/r12c_dense_aggregation_matrix.csv
    - tables/r12c_source_k_selection_matrix.csv
    - tables/r12c_member_manifest.csv
    - tables/r12c_center_summary.csv
    - tables/r12c_cross_backbone_audit_matrix.csv
    - manifests/r12c_protocol_manifest.json
    - reports/r12c_leakage_report.json
    - reports/r12c_decision_report.md

decision_rule:
  mean_090_threshold: 0.90
  rebuild_mean_bacc: 0.92
  rebuild_worst_center_bacc: 0.85
  seed_std_mean_bacc_max: 0.03
  seed_worst_center_min: 0.75
  min_delta_vs_top1: 0.005

claim_boundary:
  allowed: >
    R1.2c-V can support whether Virchow2-only source-selected dense real-feature
    config aggregation is stable enough to justify a Virchow2 CVAE preservation test.
  forbidden: >
    Do not claim CVAE utility, deploy cross-backbone aggregation, or use
    source-temperature audit rows for rebuild readiness.
