schema_version: 1
registry_kind: midogpp_experiment_stage_registry
dataset_id: midogpp
workspace_root: experiments/midogpp
canonical_artifact_root: artifacts/midogpp

ownership:
  dataset_contract: datasets/midogpp
  derived_features: datasets/midogpp/derived/features
  experiment_composition: experiments/midogpp
  generated_outputs: artifacts/midogpp
  interpretation: docs
  capability_packages:
    canonical_python_package: src/midogpp_thesis
    real_feature_methods: src/midogpp_thesis/real_features
    cvae_models: src/midogpp_thesis/cvae
    support_routing: planned
    downstream_evaluation: src/midogpp_thesis/real_features/classifier_reference

stages:
  - order: 10
    id: real_feature_reference
    directory: stages/10_real_feature_reference
    artifact_prefix: 10_real_feature_reference
    evidence_surface: real_feature_reference
    allowed_claim_scopes:
      - real_feature_transfer_only
      - real_feature_signal_controls
    allowed_input_claim_scopes:
      - dataset_contract_and_split_provenance
      - feature_cache_provenance
      - cache_integrity
    input_reuse_purposes:
      - real_feature_reference_evidence
    required_upstream:
      - midogpp_dataset_contract
      - validated_real_feature_cache
    forbidden_claims:
      - cvae_preservation
      - routing_quality
      - synthetic_downstream_utility

  - order: 20
    id: cvae_preservation
    directory: stages/20_cvae_preservation
    artifact_prefix: 20_cvae_preservation
    evidence_surface: cvae_preservation
    allowed_claim_scopes:
      - cvae_preservation_only
      - cvae_recipe_lock_only
      - cvae_source_inner_study_only
      - diagnostic_only
    allowed_input_claim_scopes:
      - dataset_contract_and_split_provenance
      - feature_cache_provenance
      - real_feature_transfer_only
      - real_feature_signal_controls
      - cvae_recipe_lock_only
    input_reuse_purposes:
      - cvae_preservation_evidence
    required_upstream:
      - validated_real_feature_reference
      - validated_real_feature_cache
    forbidden_claims:
      - routing_quality
      - controllable_generation
      - synthetic_downstream_utility

  - order: 30
    id: expert_bank
    directory: stages/30_expert_bank
    artifact_prefix: 30_expert_bank
    evidence_surface: independently_trained_source_experts
    allowed_claim_scopes:
      - expert_bank_construction_only
    allowed_input_claim_scopes:
      - dataset_contract_and_split_provenance
      - feature_cache_provenance
      - cvae_recipe_lock_only
    input_reuse_purposes:
      - expert_bank_evidence
    required_upstream:
      - validated_cvae_variant
      - source_domain_train_splits
    hard_requirements:
      - independently_trained_source_experts
      - target_expert_excluded_from_each_deployable_fold
      - checkpoint_provenance_verified

  - order: 40
    id: prior_and_generation
    directory: stages/40_prior_and_generation
    artifact_prefix: 40_prior_and_generation
    evidence_surface: generation_and_prior_diagnostics
    allowed_claim_scopes:
      - generation_diagnostics_only
      - generation_settings_and_frame_lock
    allowed_input_claim_scopes:
      - dataset_contract_and_split_provenance
      - feature_cache_provenance
      - expert_bank_construction_only
    input_reuse_purposes:
      - generation_evidence
    required_upstream:
      - validated_expert_bank
    forbidden_claims:
      - routing_quality_from_fidelity_alone
      - downstream_utility_without_stage_70_evaluation

  - order: 50
    id: all_candidate_utility_matrix
    directory: stages/50_all_candidate_utility_matrix
    artifact_prefix: 50_all_candidate_utility_matrix
    evidence_surface: posthoc_all_candidate_diagnostic
    allowed_claim_scopes:
      - diagnostic_only
    allowed_input_claim_scopes:
      - dataset_contract_and_split_provenance
      - feature_cache_provenance
      - expert_bank_construction_only
      - generation_diagnostics_only
    input_reuse_purposes:
      - all_candidate_utility_diagnostic
      - synthetic_downstream_utility_evidence
    required_upstream:
      - validated_expert_bank
      - frozen_generation_and_classifier_settings
    hard_requirements:
      - never_use_target_utility_as_router_input
      - mark_oracle_rows_non_deployable
    may_feed_deployable_selection: false

  - order: 60
    id: routing_and_composition
    directory: stages/60_routing_and_composition
    artifact_prefix: 60_routing_and_composition
    evidence_surface: pre_evaluation_routing
    allowed_claim_scopes:
      - routing_compatibility_only
      - routing_and_composition
    allowed_input_claim_scopes:
      - dataset_contract_and_split_provenance
      - feature_cache_provenance
      - expert_bank_construction_only
      - generation_settings_and_frame_lock
      - routing_compatibility_only
      - routing_and_composition
      - target_evaluation_authorization
    input_reuse_purposes:
      - routing_evidence
      - expert_selection_evidence
      - nelbo_compatibility_evidence
    performs_deployable_selection: true
    required_upstream:
      - validated_expert_bank_for_policy_artifacts
      - frozen_generation_settings_for_policy_artifacts
      - predeclared_compatibility_artifact_from_unconsumed_source_inner_evidence_or_frozen_query_metadata_available_at_routing_time_or_disjoint_unlabeled_target_support_for_ranked_selected_or_weighted_policies
    hard_requirements:
      - target_support_disjoint_from_target_evaluation
      - target_labels_not_used_for_selection
      - target_expert_excluded
      - routing_policy_frozen_before_stage_70
      - fixed_all_eligible_source_controls_may_omit_compatibility_only_when_no_ranking_selection_or_weighting_occurs
      - metadata_proxy_fields_must_be_frozen_and_available_at_routing_time
      - target_identity_may_bind_a_metadata_profile_but_must_not_enter_the_score_function
      - compatibility_only_artifacts_must_not_rank_select_weight_or_claim_utility
      - source_inner_validation_labels_may_be_consumed_once_only_for_a_predeclared_policy_family
      - outer_target_rows_must_be_removed_for_both_query_q_and_candidate_e_before_regret_normalization_or_bootstrap
      - alternative_router_or_policy_tuning_is_forbidden_after_source_inner_label_consumption
      - macro_f1_and_seed_identity_must_not_select_or_break_ties
      - uncertain_utility_regret_decisions_must_reuse_the_exact_frozen_equal_union_control
    forbidden_upstream:
      - 50_all_candidate_utility_matrix
      - 90_oracles_and_diagnostics

  - order: 70
    id: frozen_policy_downstream
    directory: stages/70_frozen_policy_downstream
    artifact_prefix: 70_frozen_policy_downstream
    evidence_surface: heldout_downstream_utility
    allowed_claim_scopes:
      - synthetic_downstream_utility
      - target_evaluation_authorization
      - descriptive_frozen_policy_comparison_on_previously_consumed_test
    allowed_input_claim_scopes:
      - dataset_contract_and_split_provenance
      - feature_cache_provenance
      - expert_bank_construction_only
      - generation_diagnostics_only
      - generation_settings_and_frame_lock
      - routing_and_composition
      - target_evaluation_authorization
    input_reuse_purposes:
      - synthetic_downstream_utility_evidence
    required_upstream:
      - frozen_stage_60_policy
      - frozen_generation_settings
      - frozen_classifier_settings
    hard_requirements:
      - target_evaluation_labels_used_for_scoring_only
      - matched_candidate_eligibility_and_budget
      - leakage_and_identity_overlap_audits
      - consumed_test_rows_may_support_descriptive_locked_policy_scoring_only
      - fresh_confirmation_requires_a_new_unconsumed_case_disjoint_surface
      - reservation_precedes_cache_extraction
      - final_authorization_binds_cache_content_before_prediction
      - all_predictions_persist_before_scoring_manifest_labels_open
      - generic_or_fresh_consumers_reject_consumed_test_reservation_cache_and_authorization

  - order: 90
    id: oracles_and_diagnostics
    directory: stages/90_oracles_and_diagnostics
    artifact_prefix: 90_oracles_and_diagnostics
    evidence_surface: posthoc_oracle_and_fidelity_diagnostics
    allowed_claim_scopes:
      - diagnostic_only
    allowed_input_claim_scopes:
      - dataset_contract_and_split_provenance
      - feature_cache_provenance
      - real_feature_transfer_only
      - real_feature_signal_controls
      - cvae_preservation_only
      - expert_bank_construction_only
      - generation_diagnostics_only
      - diagnostic_only
      - routing_and_composition
      - synthetic_downstream_utility
    input_reuse_purposes:
      - oracle_and_diagnostic_evidence
    hard_requirements:
      - mark_all_oracle_rows_non_deployable
      - keep_fidelity_separate_from_utility
    may_feed_deployable_selection: false

experiments:
  - experiment_id: midogpp.real_feature.tuned_classifier.seed42
    stage: 10_real_feature_reference
    status: active
    claim_scope: real_feature_transfer_only
    output_artifact_id: midogpp_output_real_feature_tuned_classifier_seed42
    input_artifact_ids:
      - midogpp_dataset_contract_annotation_patch_v1
      - midogpp_virchow2_xyxy_feature_cache_seed42
    runner:
      argv:
        - "{python}"
        - -m
        - midogpp_thesis
        - real-feature-classifier
        - tune
        - --manifest
        - artifact://midogpp_dataset_contract_annotation_patch_v1/manifest.csv
        - --feature-cache
        - artifact://midogpp_virchow2_xyxy_feature_cache_seed42/embeddings/train.pt
        - --out-dir
        - output://midogpp_output_real_feature_tuned_classifier_seed42
        - --classifier-c-grid
        - 0.01,0.1,1.0,10.0,100.0
        - --classifier-penalties
        - l2
        - --classifier-solvers
        - lbfgs
        - --classifier-class-weights
        - none,balanced
        - --classifier-max-iters
        - 2000,5000
        - --classifier-seed
        - "23"
        - --experiment-seed
        - "42"

  - experiment_id: midogpp.real_feature.eligible_tuned_predict_reference.v2
    stage: 10_real_feature_reference
    status: active
    claim_scope: real_feature_transfer_only
    config_path: experiments/midogpp/stages/10_real_feature_reference/configs/eligible_tuned_real_reference_v2.yaml
    output_artifact_id: midogpp_output_eligible_tuned_real_reference_v2
    input_artifact_ids:
      - midogpp_dataset_contract_annotation_patch_v1
      - midogpp_virchow2_xyxy_feature_cache_seed42
    runner:
      argv:
        - "{python}"
        - -m
        - midogpp_thesis
        - real-feature-classifier
        - matched-reference
        - --config
        - "{resolved_config}"
        - --artifact-root
        - output://midogpp_output_eligible_tuned_real_reference_v2

  - experiment_id: midogpp.real_feature.fixed_c_risk_diagnostic.v1
    stage: 10_real_feature_reference
    status: diagnostic
    claim_scope: real_feature_transfer_only
    config_path: experiments/midogpp/stages/10_real_feature_reference/configs/fixed_c_risk_diagnostic_v1.yaml
    output_artifact_id: midogpp_output_real_feature_fixed_c_risk_diagnostic_v1
    input_artifact_ids:
      - midogpp_dataset_contract_annotation_patch_v1
      - midogpp_virchow2_xyxy_feature_cache_seed42
    runner:
      argv:
        - "{python}"
        - -m
        - midogpp_thesis
        - real-feature-classifier
        - fixed-c-risk-diagnostic
        - --config
        - "{resolved_config}"
        - --artifact-root
        - output://midogpp_output_real_feature_fixed_c_risk_diagnostic_v1
    notes:
      - Four predeclared source-fit weighting arms are evaluated under one fixed classifier.
      - The diagnostic cannot select or adopt a classifier, weighting rule, recipe, or deployable policy.

  - experiment_id: midogpp.real_feature.conditional_logit_alignment.v1
    stage: 10_real_feature_reference
    status: diagnostic
    claim_scope: real_feature_transfer_only
    config_path: experiments/midogpp/stages/10_real_feature_reference/configs/conditional_logit_alignment_v1.yaml
    output_artifact_id: midogpp_output_real_feature_conditional_logit_alignment_v1
    input_artifact_ids:
      - midogpp_dataset_contract_annotation_patch_v1
      - midogpp_virchow2_xyxy_feature_cache_seed42
    runner:
      environment:
        OMP_NUM_THREADS: "1"
        MKL_NUM_THREADS: "1"
        OPENBLAS_NUM_THREADS: "1"
        NUMEXPR_NUM_THREADS: "1"
      argv:
        - "{python}"
        - -m
        - midogpp_thesis
        - real-feature-classifier
        - conditional-logit-alignment
        - --config
        - "{resolved_config}"
    notes:
      - Gamma is selected separately per outer center using source-inner center LODO only.
      - The output is a standalone non-adoptive real-feature diagnostic and cannot feed Stage 20 or later selection.

  - experiment_id: midogpp.real_feature.physical_multiscale_center_pooling_pilot.v1
    stage: 10_real_feature_reference
    status: planned
    claim_scope: real_feature_transfer_only
    config_path: experiments/midogpp/stages/10_real_feature_reference/configs/physical_multiscale_center_pooling_pilot_v1.yaml
    output_artifact_id: midogpp_output_real_feature_physical_multiscale_center_pooling_pilot_v1
    input_artifact_ids:
      - midogpp_dataset_contract_annotation_patch_v1
      - midogpp_dataset_contract_physical_multiscale_center_pooling_pilot_v1
      - midogpp_virchow2_xyxy_feature_cache_seed42
      - midogpp_virchow2_jpeg_center_pooling_3840_seed42
      - midogpp_virchow2_physical_multiscale_center_pooling_11520_seed42
      - midogpp_output_eligible_tuned_real_reference_v2
    input_claim_scope_exceptions:
      midogpp_output_eligible_tuned_real_reference_v2: Protocol review requires this frozen Stage-10 output only as the exact canonical-A replay comparator; it is not a selection candidate or upstream claim.
    runner:
      environment:
        OMP_NUM_THREADS: "1"
        MKL_NUM_THREADS: "1"
        OPENBLAS_NUM_THREADS: "1"
        NUMEXPR_NUM_THREADS: "1"
      argv:
        - "{python}"
        - -m
        - midogpp_thesis
        - real-feature-classifier
        - physical-multiscale-center-pooling-pilot
        - --config
        - "{resolved_config}"
    notes:
      - Non-runnable historical plan; the xai-master geometry audit failed before any contract, cache, or Stage-10 run was created.
      - Failure evidence is retained only as midogpp_physical_multiscale_center_pooling_v1_failed_geometry_audit.
      - Do not activate, resume, or repoint this v1 entry.

  - experiment_id: midogpp.real_feature.physical_multiscale_annotation_local_pooling_pilot.v2
    stage: 10_real_feature_reference
    status: planned
    claim_scope: real_feature_transfer_only
    config_path: experiments/midogpp/stages/10_real_feature_reference/configs/physical_multiscale_annotation_local_pooling_pilot_v2.yaml
    output_artifact_id: midogpp_output_real_feature_physical_multiscale_annotation_local_pooling_pilot_v2
    input_artifact_ids:
