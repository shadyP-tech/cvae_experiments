  - experiment_id: midogpp.cvae.task_fisher_shrinkage_source_inner.v2
    stage: 20_cvae_preservation
    status: active
    claim_scope: cvae_source_inner_study_only
    config_path: experiments/midogpp/stages/20_cvae_preservation/configs/task_fisher_shrinkage_source_inner_v2.yaml
    output_artifact_id: midogpp_output_cvae_task_fisher_shrinkage_source_inner_v2
