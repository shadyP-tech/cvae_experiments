      - midogpp_dataset_contract_physical_multiscale_annotation_local_pooling_pilot_v2
      - midogpp_virchow2_xyxy_feature_cache_seed42
      - midogpp_virchow2_annotation_local_pooling_bc_bundle_seed42_v2
      - midogpp_virchow2_annotation_jpeg_fixed_center_pooling_3840_v2_seed42
      - midogpp_virchow2_physical_multiscale_annotation_local_pooling_11520_v2_seed42
      - midogpp_output_eligible_tuned_real_reference_v2
    input_claim_scope_exceptions:
      midogpp_output_eligible_tuned_real_reference_v2: Frozen Stage-10 output is used only as the exact canonical-A replay comparator; it is not a selection candidate or upstream claim.
    runner:
      environment:
        OMP_NUM_THREADS: "1"
        MKL_NUM_THREADS: "1"
        OPENBLAS_NUM_THREADS: "1"
        NUMEXPR_NUM_THREADS: "1"
      argv:
        - "{python}"
        - -m
        - midogpp_thesis
        - real-feature-classifier
        - physical-multiscale-annotation-local-pooling-pilot
        - --config
        - "{resolved_config}"
    notes:
      - Non-runnable historical plan; the xai-master geometry audit failed before any v2 contract, cache, or Stage-10 run was created.
      - Failure evidence is retained only as midogpp_physical_multiscale_annotation_local_pooling_v2_failed_geometry_audit.
      - Do not activate, resume, or repoint this v2 entry.

  - experiment_id: midogpp.real_feature.physical_multiscale_clipped_bbox_annotation_local_pooling_pilot.v3
    stage: 10_real_feature_reference
    status: diagnostic
    claim_scope: real_feature_transfer_only
    config_path: experiments/midogpp/stages/10_real_feature_reference/configs/physical_multiscale_clipped_bbox_annotation_local_pooling_pilot_v3.yaml
    output_artifact_id: midogpp_output_real_feature_physical_multiscale_clipped_bbox_annotation_local_pooling_pilot_v3
    input_artifact_ids:
      - midogpp_dataset_contract_annotation_patch_v1
      - midogpp_dataset_contract_physical_multiscale_clipped_bbox_annotation_local_pooling_pilot_v3
      - midogpp_virchow2_xyxy_feature_cache_seed42
      - midogpp_virchow2_clipped_bbox_annotation_local_pooling_bc_bundle_seed42_v3
      - midogpp_virchow2_annotation_jpeg_fixed_center_pooling_3840_v3_seed42
      - midogpp_virchow2_physical_multiscale_clipped_bbox_annotation_local_pooling_11520_v3_seed42
      - midogpp_output_eligible_tuned_real_reference_v2
    input_claim_scope_exceptions:
      midogpp_output_eligible_tuned_real_reference_v2: Frozen Stage-10 output is used only as the exact canonical-A replay comparator; it is not a selection candidate or upstream claim.
    runner:
      environment:
        OMP_NUM_THREADS: "1"
        MKL_NUM_THREADS: "1"
        OPENBLAS_NUM_THREADS: "1"
        NUMEXPR_NUM_THREADS: "1"
      argv:
        - "{python}"
        - -m
        - midogpp_thesis
        - real-feature-classifier
        - physical-multiscale-annotation-local-pooling-pilot
        - --config
        - "{resolved_config}"
    notes:
      - Diagnostic activation followed the clipped-bbox workstation audit, atomic contract/cache publication, independent validation, complete expected-hash promotion, and reviewer approval.
      - The run remains non-adoptive and cannot revise the frozen reference, representation recipe, or any downstream stage.
      - The maximum claim is performance of the complete nested representation-plus-classifier diagnostic; no Stage-20-through-70 reuse is allowed.

  - experiment_id: midogpp.real_feature.signal_controls.v1
    stage: 10_real_feature_reference
    status: diagnostic
    claim_scope: real_feature_signal_controls
    config_path: experiments/midogpp/stages/10_real_feature_reference/configs/virchow2_signal_controls_v1.yaml
