  - experiment_id: midogpp.cvae.aggregate_posterior_mixture_geco_source_inner.v3
    stage: 20_cvae_preservation
    status: active
    claim_scope: cvae_source_inner_study_only
    config_path: experiments/midogpp/stages/20_cvae_preservation/configs/aggregate_posterior_mixture_geco_source_inner_v3.yaml
    output_artifact_id: midogpp_output_cvae_aggregate_posterior_mixture_geco_source_inner_v3
    input_artifact_ids:
      - midogpp_dataset_contract_annotation_patch_v1
      - midogpp_virchow2_xyxy_feature_cache_seed42
    runner:
      environment:
        CUBLAS_WORKSPACE_CONFIG: ":4096:8"
        OMP_NUM_THREADS: "1"
        MKL_NUM_THREADS: "1"
        OPENBLAS_NUM_THREADS: "1"
        NUMEXPR_NUM_THREADS: "1"
      argv:
        - "{python}"
        - -m
        - midogpp_thesis
        - cvae-preservation
        - source-inner-aggregate-posterior-mixture-geco
        - --config
        - "{resolved_config}"
        - --artifact-root
        - output://midogpp_output_cvae_aggregate_posterior_mixture_geco_source_inner_v3
    notes:
      - Trains every candidate CVAE, PCA frame, aggregate prior, and GECO target on exactly one source center.
      - This is a non-consumable source-inner study; even a positive result requires a separate validated promotion artifact before Stage 30 may change.

  - experiment_id: midogpp.cvae.prior_recovery_outer.v1
    stage: 20_cvae_preservation
    status: active
    claim_scope: cvae_preservation_only
    config_path: experiments/midogpp/stages/20_cvae_preservation/configs/prior_recovery_outer_v1.yaml
    output_artifact_id: midogpp_output_cvae_prior_recovery_outer_v1
