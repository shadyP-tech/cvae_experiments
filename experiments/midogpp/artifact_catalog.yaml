schema_version: 2
catalog_kind: midogpp_artifact_catalog
last_reviewed: 2026-07-23
path_base: repository_root

catalog_policy:
  historical_entries_preserve_original_manifests_and_bytes: true
  canonical_output_entries_are_run_destinations: true
  active_resolution_uses_canonical_roots_only: true
  moved_artifacts_require_pre_post_hash_equality: true
  preserve_original_manifests_and_hashes: true
  semantic_identities_are_not_treated_as_file_hashes: true
  expected_file_hashes_are_verified_during_prepare: true
  provenance_files_receive_computed_sha256_during_prepare: true
  evidence_authority: pointed_protocol_manifests_and_reports
  new_run_outputs_belong_under: artifacts/midogpp
  new_dataset_contracts_belong_under: datasets/midogpp/contract
  new_derived_feature_caches_belong_under: datasets/midogpp/derived/features

artifacts:
  - artifact_id: midogpp_raw_tiff_source_v1
    stage: raw_source
    physical_path: datasets/midogpp/raw/MIDOGpp
    availability: workstation_only
    migration: hash_verified_move
    evidence_label: AUDIT_ONLY
    claim_scope: dataset_contract_and_split_provenance
    required_files:
      - midogpp_scanner_metadata_full_resplit.csv
    notes:
      - Workstation-only raw MIDOG++ TIFF source; the approximately 65 GB payload is intentionally not synced to the Mac.
      - Physical multiscale contracts must bind individual level-0 TIFF hashes before feature extraction.

  - artifact_id: midogpp_dataset_contract_annotation_patch_v1
    stage: dataset_contract
    physical_path: datasets/midogpp/contract/annotation_patch_v1
