      - synthetic_downstream_utility_evidence
      - oracle_and_diagnostic_evidence
    may_feed_recipe_selection: false
    may_feed_deployable_selection: true
    notes:
      - Narrow alias for the hash-pinned manifest used in one predeclared Stage-60 source-inner pseudo-target scoring event.
