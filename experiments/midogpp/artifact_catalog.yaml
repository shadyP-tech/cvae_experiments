schema_version: 2
catalog_kind: midogpp_artifact_catalog
last_reviewed: 2026-07-12
path_base: repository_root

catalog_policy:
  historical_entries_preserve_original_manifests_and_bytes: true
  canonical_output_entries_are_run_destinations: true
  active_resolution_uses_canonical_roots_only: true
  moved_artifacts_require_pre_post_hash_equality: true
  preserve_original_manifests_and_hashes: true
  semantic_identities_are_not_treated_as_file_hashes: true
  expected_file_hashes_are_verified_during_prepare: true
  provenance_files_receive_computed_sha256_during_prepare: true
  evidence_authority: pointed_protocol_manifests_and_reports
  new_outputs_belong_under: artifacts/midogpp

