    evidence_label: AUDIT_ONLY
    claim_scope: dataset_contract_and_split_provenance
    semantic_identities:
      contract_identity: midogpp_annotation_patch_v1
    authoritative_files:
      - dataset_contract.json
      - manifest.csv
      - split_manifest.csv
      - leakage_report.json
      - path_relocation.json
    expected_file_hashes:
      dataset_contract.json:
        algorithm: sha256
        digest: 2c36620fc318d4790b09951eaa13105c829bc47aa18bb285a9e86e31252873c8
      manifest.csv:
        algorithm: sha256
        digest: db661ac7e3dbafde8e283528de6706ab35f2c26629b389706c4504e458cc5869
      split_manifest.csv:
        algorithm: sha256
        digest: 2f1e992bcc18518b2744461d659cade6cd41b0ae0bf3f099eb5adc78d4637c68
      leakage_report.json:
        algorithm: sha256
        digest: 734de602385d5fe5878da355ec0202324bb7ad55c201c41765fe0daee9e4bc24
      path_relocation.json:
        algorithm: sha256
        digest: 6ac700494a5e20f8ce209c87148311bb1410d9fb3bd6a07e2ff16b474b8a842c
    notes:
      - Frozen manifest paths retain their original repository prefix for hash stability.
      - path_relocation.json maps only that audited prefix to the canonical contract tree.
      - The complete 22569-patch payload is present locally and on the workstation at the canonical path.

  - artifact_id: midogpp_routing_metadata_profiles_v1
    stage: dataset_contract
    physical_path: datasets/midogpp/contract/annotation_patch_v1
    availability: local_and_workstation
    migration: hash_verified_move
    evidence_label: ROUTING_METADATA_INPUT_AUTHORIZED
    claim_scope: dataset_contract_and_split_provenance
    semantic_identities:
      routing_metadata_source: midogpp_domain_mapping_v1
      domain_axis: tumor_type|lab_or_origin|scanner_model
      domain_mapping_sha256: 79d703ccf3085ae3968698c2ac44a3eabc2713b434762cc6b2fd2fa90126a211
    required_files:
      - domain_mapping.json
    expected_file_hashes:
      domain_mapping.json:
        algorithm: sha256
        digest: 79d703ccf3085ae3968698c2ac44a3eabc2713b434762cc6b2fd2fa90126a211
    may_feed_recipe_selection: false
    may_feed_deployable_selection: true
    notes:
      - Narrow routing-time metadata input; it authorizes only the hash-pinned domain mapping, not the labeled sample manifest or target outcomes.
      - Compatibility consumers may expose only tumor type, lab or origin, and scanner model profiles and must not use domain counts, labels, sample identities, or held-out metrics.
      - Query metadata is a routing proxy input, not NELBO, expected utility, oracle agreement, routing-quality evidence, or downstream utility.

