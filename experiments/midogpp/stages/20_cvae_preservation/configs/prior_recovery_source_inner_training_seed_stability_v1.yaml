experiment:
  name: virchow2_cvae_midogpp_prior_recovery_source_inner_training_seed_stability_v1
  mode: source_inner_training_seed_stability
  artifact_root: output://midogpp_output_cvae_prior_recovery_source_inner_training_seed_stability_v1
  code_version: prior_recovery_training_seed_stability_v1
  child_code_version: prior_recovery_v2_resume

inputs:
  manifest_path: artifact://midogpp_dataset_contract_annotation_patch_v1/manifest.csv
  feature_cache_path: artifact://midogpp_virchow2_xyxy_feature_cache_seed42/embeddings/train.pt

run:
  heldout_centers: all
  expected_feature_dim: 2560
  selection_training_seed: 17
  training_seeds: [17, 42, 101]
  generation_seeds: [17, 42, 101]
  device: cuda:0

model:
  pca_dim: 128
  latent_dim: 32
  hidden_dim: 512
  num_hidden_layers: 2
  train_epochs: 100
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  beta_final: 0.001
  kl_warmup_epochs: 25
  task_fisher_alpha: 1.0

sampler:
  min_class_count: 64
  max_condition_number: 1000000
  families:
    - standard_normal
    - class_conditional_diagonal_total_moment
    - class_conditional_shrinkage_full_total_moment
  fallback: full_to_diagonal_to_standard_per_class
  viability: require_requested_family_both_classes

decisions:
  gate_min_ratio_improvement: 0.05
  gate_min_inner_wins: 6
  sampler_tie_margin: 0.01
  task_increment_min_ratio: 0.01
  safety_max_bacc_regression: 0.01
  minimum_real_bacc: 0.55
  training_seed_consensus_rule: unanimous_conditional_family_d_only_if_all_d_else_c_v1

claim_boundary:
  allowed: fully nested source-inner training-seed stability and consensus recipe locking only
  forbidden: outer-target preservation, routing, composition, or downstream utility
