experiment:
  name: virchow2_cvae_midogpp_tuned_classifier_preservation_v1
  artifact_root: output://midogpp_output_cvae_tuned_classifier_preservation_v1

inputs:
  manifest_path: artifact://midogpp_dataset_contract_annotation_patch_v1/manifest.csv
  feature_cache_path: artifact://midogpp_virchow2_xyxy_feature_cache_seed42/embeddings/train.pt
  real_feature_reference_artifact_root: artifact://midogpp_real_feature_threshold_both_xyxy_seed42
  allow_npz_test_cache: false

positive_label: 1

run:
  experiment_seed: 42
  heldout_centers: all

variant:
  variant_id: pca128_beta001
  pca_dim: 128
  latent_dim: 32
  hidden_dim: 512
  num_hidden_layers: 2
  train_epochs: 100
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  beta_final: 0.001
  kl_warmup_epochs: 25

validity_thresholds:
  min_fit: 20
  min_eval: 10
  min_fit_pos: 10
  min_fit_neg: 10
  min_eval_pos: 5
  min_eval_neg: 5
  min_fit_cases: 3
  min_eval_cases: 2

bootstrap:
  reps: 1000
  seed: 1337

reference_validation:
  real_reference_min_bacc_for_ratio: 0.55
  ci_low_threshold: 0.50
  expected_manifest_hash: db661ac7e3dbafde8e283528de6706ab35f2c26629b389706c4504e458cc5869
  expected_feature_cache_hash: f6608e513fb2d06671e3ec117b093a85d58530b77b1fae44a3be1680d9feabd2

claim_boundary:
  allowed: >
    pca128 CVAE decode/posterior/prior preservation under per-held-out-center
    source-inner tuned classifier specs imported from the real Virchow2
    reference artifact.
  forbidden: >
    No routing, expert selection, metadata compatibility, NELBO compatibility,
    controllable generation, GMM composition, or downstream synthetic-utility
    claim.
