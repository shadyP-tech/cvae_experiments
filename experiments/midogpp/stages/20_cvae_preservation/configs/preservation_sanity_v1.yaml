experiment:
  name: virchow2_cvae_midogpp_preservation_sanity_v1
  artifact_root: output://midogpp_output_cvae_preservation_sanity_v1

inputs:
  manifest_path: artifact://midogpp_dataset_contract_annotation_patch_v1/manifest.csv
  feature_cache_path: artifact://midogpp_virchow2_xyxy_feature_cache_seed42/embeddings/train.pt
  signal_split_manifest_path: artifact://midogpp_virchow2_real_feature_signal_controls/tables/split_manifest.csv
  signal_decision_report_path: artifact://midogpp_virchow2_real_feature_signal_controls/reports/decision_report.md
  allow_npz_test_cache: false

positive_label: 1

run:
  controls:
    - pooled_case_disjoint_control
    - pooled_tumor_class_balanced_case_split
    - within_tumor_case_disjoint_control
  primary_variant: pca64_beta001
  split_seeds: all

validity_thresholds:
  min_fit: 20
  min_eval: 10
  min_fit_pos: 10
  min_fit_neg: 10
  min_eval_pos: 5
  min_eval_neg: 5
  min_fit_cases: 3
  min_eval_cases: 2

bootstrap:
  reps: 1000
  seed: 1337

decision_thresholds:
  real_gate_min_bacc: 0.60
  cvae_gate_min_bacc: 0.60
  ci_low_threshold: 0.50
  preservation_pass_ratio: 0.80
  preservation_strong_ratio: 0.90
  within_tumor_min_above_fraction: 0.60

variants:
  - variant_id: pca64_beta001
    pca_dim: 64
    latent_dim: 16
    hidden_dim: 512
    num_hidden_layers: 2
    train_epochs: 100
    batch_size: 128
    learning_rate: 0.001
    weight_decay: 0.0001
    beta_final: 0.001
    kl_warmup_epochs: 25

  - variant_id: pca128_beta001
    pca_dim: 128
    latent_dim: 32
    hidden_dim: 512
    num_hidden_layers: 2
    train_epochs: 100
    batch_size: 128
    learning_rate: 0.001
    weight_decay: 0.0001
    beta_final: 0.001
    kl_warmup_epochs: 25

claim_boundary:
  allowed: >
    CVAE preservation mechanics under MIDOG++ signal-control splits if the
    real-frame tumor-balanced comparator is suitable.
  forbidden: >
    Do not claim routing, expert selection, metadata compatibility, or
    multiaxis LODO CVAE preservation from this diagnostic.
