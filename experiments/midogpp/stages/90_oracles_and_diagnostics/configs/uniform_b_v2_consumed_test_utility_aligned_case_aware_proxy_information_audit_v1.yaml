proxy_features:
  family: predeclared_case_aware_compact_proxy_information_v1
  feature_row_unit: candidate_H_q_e
  feature_row_count: 504
  fixed_support_case_count_per_center: 8
  support_probabilities_are_label_free: true
  support_probabilities_averaged_across_exact_nine_seed_cells: true
  support_rows_aggregated_with_equal_case_weight: true
  evaluation_probabilities_used: false
  primitive_names:
    - metadata_similarity
    - pooled_row_weighted_abs_shift
    - equal_case_abs_shift
    - case_abs_shift_sd
    - equal_case_signed_margin
    - case_balanced_flip_rate
    - case_balanced_entropy_change
    - case_balanced_reconstruction
    - case_balanced_kl
    - case_balanced_log_mmd
  primitive_formulas:
    metadata_similarity: exact_match_count_tumor_type_lab_or_origin_scanner_model_div_3
    pooled_row_weighted_abs_shift: mean_support_rows_abs(mean9_p_tail_minus_mean9_p_base)
    equal_case_abs_shift: mean_support_cases(mean_case_rows_abs(mean9_p_tail_minus_mean9_p_base))
    case_abs_shift_sd: population_sd_support_cases(mean_case_rows_abs(mean9_p_tail_minus_mean9_p_base))
    equal_case_signed_margin: mean_support_cases(mean_case_rows((mean9_p_tail_minus_mean9_p_base)*where(mean9_p_base_gte_0.5,1,-1)))
    case_balanced_flip_rate: mean_support_cases(mean_case_rows(indicator((mean9_p_base_minus_0.5)*(mean9_p_tail_minus_0.5)<0)))
    case_balanced_entropy_change: mean_support_cases(mean_case_rows(binary_entropy(mean9_p_tail)-binary_entropy(mean9_p_base)))
    case_balanced_reconstruction: mean_support_cases(mean_case_rows(reconstruction))
    case_balanced_kl: mean_support_cases(mean_case_rows(analytic_kl))
    case_balanced_log_mmd: mean_support_cases(mean_exact9(log1p(linear_kernel_mmd2(case_embedding_mean, generated_stream_mean))))
  derived_within_query_predictors:
    - case_balanced_reconstruction_z
    - case_balanced_kl_z
    - case_balanced_log_mmd_z
  within_query_standardization_uses_only_current_label_free_candidate_list: true
  within_query_standardization_uses_utility_or_evaluation_labels: false
  zero_variance_standardized_value: 0.0
  cyclic_directional_permutation: canonical_allowed_source_order_nonzero_rotation_by_one
  cyclic_directional_permutation_seed: 90902026
  cyclic_directional_permutation_shift: 1
  technical_seed_rows_are_features: false
