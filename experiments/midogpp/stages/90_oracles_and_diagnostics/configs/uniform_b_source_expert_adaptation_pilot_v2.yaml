experiment:
  schema_version: midogpp_uniform_b_source_expert_adaptation_pilot_v2
  name: uniform_b_source_expert_adaptation_pilot_v2
  artifact_root: output://midogpp_output_uniform_b_source_expert_adaptation_pilot_v2
  code_version: uniform_b_source_expert_adaptation_pilot_v2

inputs:
  manifest_path: artifact://midogpp_dataset_contract_annotation_patch_v1/manifest.csv
  b_feature_cache_path: artifact://midogpp_virchow2_uniform_b_canonical_train_cache_seed42/embeddings/train.pt
  a_feature_cache_path: artifact://midogpp_virchow2_xyxy_feature_cache_seed42/embeddings/train.pt
  predecessor_failure_audit_path: artifact://midogpp_uniform_b_source_expert_adaptation_pilot_v1_failure_audit/failure_audit.json

run:
  centers: ["2", "5", "6", "9"]
  arms: [a_global_pca128, b_joint_pca128, b_block_pca96_32]
  training_seeds: [17, 42, 101]
  generation_seeds: [17, 42, 101]
  devices: [cuda:0, cuda:1]
  cpu_threads_per_worker: 1

representation:
  expected_b_dim: 3840
  global_dim: 2560
  local_dim: 1280
  pca_dim: 128
  block_global_pca_dim: 96
  block_local_pca_dim: 32
  svd_solver: randomized
  random_state: 0
  n_oversamples: 10
  iterated_power: 4
  whiten: false
  post_fit_reweighting: false

case_holdout:
  policy: deterministic_case_disjoint_single_split_v1
  validation_fraction: 0.20
  seed: 2718
  train_split_only: true
  require_both_classes_on_both_sides: true

training:
  objective: stochastic_isotropic_beta_objective_step_normalized_v1
  optimizer_steps: 1000
  batch_size: 128
  hidden_dim: 512
  latent_dim: 32
  num_hidden_layers: 2
  learning_rate: 0.001
  weight_decay: 0.0001
  beta_final: 0.001
  kl_warmup_steps: 250
  gradient_clip_norm: 5.0
  batch_policy: class_to_case_to_row_balanced_with_replacement_v1

conditional_prior:
  family: class_conditional_diagonal_standard_shrinkage_rho025_v1
  rho: 0.25
  min_rows_per_class: 64
  min_cases_per_class: 5
  variance_clip: [0.25, 4.0]
  max_condition_number: 10000.0
  fallback_family: standard_normal
  selection_on_holdout: false

evaluation:
  generated_per_class: 512
  classifier_family: standard_scaler_l2_logistic
  classifier_c: 0.01
  classifier_class_weight: balanced
  classifier_threshold: 0.5
  minimum_real_bacc: 0.60
  heldout_labels_used_for_classifier_fit: false
  heldout_labels_used_for_cvae_fit: false
  heldout_labels_used_for_denominator_preflight_gate: true
  heldout_labels_used_for_scoring: true
  heldout_labels_used_for_diagnostic_progression_decision: true
  heldout_labels_used_for_confirmation: false
  heldout_class_used_for_cvae_reconstruction_conditioning: true

protocol_amendment:
  predecessor_experiment: midogpp.oracle.uniform_b_source_expert_adaptation_pilot.v1
  predecessor_artifact: midogpp_output_uniform_b_source_expert_adaptation_pilot_v1
  predecessor_failure_audit_artifact: midogpp_uniform_b_source_expert_adaptation_pilot_v1_failure_audit
  predecessor_status: FAILED_PREDECLARED_REAL_DENOMINATOR
  predecessor_protocol_hash: a8743bf0ae4e9b02
  predecessor_config_resolved_sha256: e364c7f44c858dbce515b041ce73a00c5c963e2fcd59a60a972951333d32ae7b
  predecessor_failure_audit_sha256: ce06ac0156679db15b156c392c475284c6bfa6af05bab34f2bd48e4dc8ebdb35
  observed_failure_center: "9"
  observed_failure_arm: a_global_pca128
  observed_failure_bacc: 0.5942461434523139
  observed_failure_pca_n_oversamples: 16
  reason: approval_preflight_and_production_pca_policy_mismatch
  preserved_denominator_floor: 0.60
  sole_parameter_change: randomized_pca_n_oversamples_16_to_10
  preflight_outcomes_inspected_before_amendment: true
  confirmation_eligible: false
  rehabilitates_v1: false
  may_promote_v1_outputs: false

claim_boundary:
  claim_scope: diagnostic_only
  allowed: source-local canonical-B-to-CVAE feasibility evidence on consumed train-case holdouts
  forbidden: recipe export, expert-bank activation, prior promotion, routing, generation utility, new-center, scanner, external-dataset, or confirmation claims
  may_export_recipe_lock: false
  may_feed_expert_bank: false
  may_feed_generation: false
  may_feed_routing: false
  next_step_if_pass: separately reviewed full canonical-B source-inner recipe study
