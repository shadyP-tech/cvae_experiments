  expected_grid_hash: 5abd0897d02bdcaa
  expected_representation_candidate_count: 30
  expected_representation_candidate_hash: b572cc680b088ecd
  c_grid: [0.01, 0.1, 1.0, 10.0, 100.0]
  penalty: l2
  solver: lbfgs
  class_weight: [none, balanced]
  max_iter: [5000]
  threshold_policy: predict
