representation_gate:
  mean_delta_min: 0.02
  strict_win_delta_min: 1.0e-12
  strict_win_count_min: 6
  worst_delta_min: -0.01
  fallback: canonical_a

bootstrap:
  seed: 42
  valid_replicates: 2000
  max_attempts: 20000
  resampling_unit: evaluation_case_within_center
  interval_role: conditional_on_fixed_fits_and_locked_selection

claim_boundary:
  claim_scope: real_feature_transfer_only
  diagnostic_only: true
  non_adoptive: true
  may_feed_recipe_selection: false
  may_feed_deployable_selection: false
  target_evaluation_labels_used_for_selection: false
  target_evaluation_labels_used_for_scoring_only: true
  uses_cvae: false
  uses_nelbo: false
  uses_router: false
  performs_aggregation: false
  allowed: diagnostic performance of the complete nested adaptive representation pipeline
  forbidden: representation-only, probabilistic, calibration, new-center, NELBO, deployment, routing, CVAE preservation, or Stage-20-through-70 claims

