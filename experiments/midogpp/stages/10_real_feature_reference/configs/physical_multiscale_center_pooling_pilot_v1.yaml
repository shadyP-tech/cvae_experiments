experiment:
  name: physical_multiscale_center_pooling_pilot_v1
  artifact_root: output://midogpp_output_real_feature_physical_multiscale_center_pooling_pilot_v1

inputs:
  base_manifest_path: artifact://midogpp_dataset_contract_annotation_patch_v1/manifest.csv
  physical_contract_root: artifact://midogpp_dataset_contract_physical_multiscale_center_pooling_pilot_v1
  canonical_a_cache_path: artifact://midogpp_virchow2_xyxy_feature_cache_seed42/embeddings/train.pt
  b_cache_root: artifact://midogpp_virchow2_jpeg_center_pooling_3840_seed42
  c_cache_root: artifact://midogpp_virchow2_physical_multiscale_center_pooling_11520_seed42
  canonical_reference_root: artifact://midogpp_output_eligible_tuned_real_reference_v2
  split: train

representations:
  canonical_a:
    feature_dim: 2560
    source: canonical corrected-xyxy JPEG Virchow2 CLS plus global patch mean
  jpeg_center_b:
    feature_dim: 3840
    source: exact canonical JPEG preprocessing plus center 4x4 patch-token mean
  physical_multiscale_center_c:
    feature_dim: 11520
    source: 28um, 56um, and 112um raw-TIFF crops with CLS, global, and center pooling

run:
  experiment_seed: 42
  classifier_seed: 23
  heldout_centers: ["0", "1", "2", "3", "5", "6", "7", "8", "9"]
  expected_selector_cells: 2160
  expected_candidate_summaries: 270
  allow_partial_test_coverage: false

