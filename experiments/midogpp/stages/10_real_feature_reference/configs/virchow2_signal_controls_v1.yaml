experiment:
  name: midogpp_virchow2_real_feature_signal_controls
  stage: virchow2_real_feature_train_cache_signal_controls
  status: diagnostic

inputs:
  manifest_path: artifact://midogpp_dataset_contract_annotation_patch_v1/manifest.csv
  feature_cache_path: artifact://midogpp_virchow2_xyxy_feature_cache_seed42/embeddings/train.pt
  allow_npz_test_cache: false

positive_label: 1
label_mapping:
  "0": non_mitotic_hard_negative
  "1": mitotic

split:
  seeds: [42, 43, 44, 45, 46]
  eval_fraction: 0.20

validity_thresholds:
  min_fit: 20
  min_eval: 10
  min_fit_pos: 10
  min_fit_neg: 10
  min_eval_pos: 5
  min_eval_neg: 5
  min_fit_pos_cases: 3
  min_fit_neg_cases: 3
  min_eval_pos_cases: 2
  min_eval_neg_cases: 2

mlp_sensitivity:
  min_fit: 100
  min_fit_pos: 20
  min_fit_neg: 20
  seeds: [42, 43, 44]

bootstrap:
  reps: 1000
  seed: 1337

prior_lodo:
  axis_summary_path:

output:
  artifacts_root: output://midogpp_output_real_feature_signal_controls_v1

claim_boundary:
  allowed: >
    Real Virchow2 train-cache binary class signal under pooled,
    tumor-class-balanced, and within-tumor case-disjoint controls.
  forbidden: >
    Do not claim CVAE preservation, metadata-routing compatibility, or
    target-domain routing utility from this diagnostic.
