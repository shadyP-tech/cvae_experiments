experiment:
  name: midogpp_source_inner_reliability_v1
  schema_version: midogpp_source_inner_reliability_v1
  status: implementation_ready

protocol:
  dataset: midogpp
  positive_label: 1
  positive_label_name: mitotic
  eligible_centers: ["0", "1", "2", "3", "5", "6", "7", "8", "9"]
  quarantine_centers: ["4"]
  method: source_inner_utility_weighted_dense_late_ensemble
  source_inner_score: fold_zscore_then_mean_over_eligible_pseudo_target_folds
  target_expert: excluded_from_candidate_pool
  target_labels: scoring_only
  pooled_rows: not_used
  oracle_rows: diagnostic_only_if_added_later

inputs:
  manifest_path: datasets/midogpp/artifacts/midogpp_annotation_patch_v1/manifest.csv
  feature_cache_path: sail/artifacts/pathology_embeddings/virchow2/midogpp/seed42/embeddings/train.pt

model:
  member_classifier: sklearn_logistic_regression_fixed_v1
  model_seed: 0
  threshold_policy: fixed_prob_pos_ge_0.5
  calibration_policy: none_scores_not_claimed_calibrated

source_inner_reliability:
  utility_family: balanced_accuracy
  fold_normalization: zscore_within_pseudo_target_candidate_pool
  epsilon: 1.0e-12
  missing_rows: not_imputed
  all_invalid_fallback: uniform_dense
  all_tied_fallback: uniform_dense

weight_policy:
  transform: softmax
  tau: 1.0
  cap_min:
  cap_max:
  shrinkage: 0.0

artifacts:
  root: midogpp_real_feature_gate/artifacts/midogpp_source_inner_reliability_v1
  tables:
    - source_inner_reliability.csv
    - ensemble_weights.csv
    - member_predictions_manifest.csv
    - ensemble_results.csv
    - ensemble_predictions.csv
  manifests:
    - protocol_manifest.json
  reports:
    - leakage_provenance_report.json
