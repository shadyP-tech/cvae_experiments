<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">AE utility calibrated safe override pipeline</title>
  <desc id="desc">Slide-ready diagram showing source-only calibration, query-time safe override routing, and held-out NELBO evaluation for ae_utility_calibrated_safe_override_v1.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 54px Arial, Helvetica, sans-serif; fill: #111827; }
      .subtitle { font: 400 28px Arial, Helvetica, sans-serif; fill: #374151; }
      .section-label { font: 700 26px Arial, Helvetica, sans-serif; fill: #111827; }
      .box-title { font: 700 28px Arial, Helvetica, sans-serif; fill: #111827; }
      .box-body { font: 400 22px Arial, Helvetica, sans-serif; fill: #374151; }
      .small { font: 400 18px Arial, Helvetica, sans-serif; fill: #4b5563; }
      .tiny { font: 400 16px Arial, Helvetica, sans-serif; fill: #6b7280; }
      .note { font: 700 20px Arial, Helvetica, sans-serif; fill: #7c2d12; }
      .box { fill: #f9fafb; stroke: #d1d5db; stroke-width: 2; rx: 18; }
      .source { fill: #eef2ff; stroke: #6366f1; }
      .ae { fill: #ecfeff; stroke: #0891b2; }
      .cal { fill: #f0fdf4; stroke: #16a34a; }
      .route { fill: #fff7ed; stroke: #ea580c; }
      .eval { fill: #fef2f2; stroke: #dc2626; }
      .guard { fill: #fffbeb; stroke: #d97706; stroke-dasharray: 8 6; }
      .arrow { stroke: #1f2937; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .thin-arrow { stroke: #6b7280; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .divider { stroke: #e5e7eb; stroke-width: 3; stroke-dasharray: 10 10; }
    </style>
  </defs>

  <rect class="bg" width="1920" height="1080"/>

  <text x="96" y="86" class="title">AE Utility Calibrated Safe Override</text>
  <text x="96" y="126" class="subtitle">Method: ae_utility_calibrated_safe_override_v1</text>
  <text x="96" y="162" class="subtitle">A source-only familiarity signal becomes a gated routing decision, then is judged by held-out NELBO utility.</text>

  <line x1="96" y1="530" x2="1824" y2="530" class="divider"/>
  <text x="96" y="184" class="section-label">1. Source-only calibration loop</text>
  <text x="96" y="582" class="section-label">2. Query-time routing and evaluation</text>

  <rect x="96" y="220" width="300" height="190" class="box source"/>
  <text x="126" y="270" class="box-title">Source domains</text>
  <text x="126" y="320" class="box-body">Use source domains only</text>
  <text x="126" y="372" class="small">No target-query labels</text>

  <rect x="468" y="220" width="330" height="190" class="box ae"/>
  <text x="498" y="270" class="box-title">AE familiarity scores</text>
  <text x="498" y="320" class="box-body">Score query fit per AE</text>
  <text x="498" y="382" class="small">Lower reconstruction error = familiar</text>

  <rect x="870" y="220" width="360" height="190" class="box cal"/>
  <text x="900" y="270" class="box-title">Source-inner utility fit</text>
  <text x="900" y="320" class="box-body">Predict gain over AE anchor</text>
  <text x="900" y="382" class="small">Trained on source-inner NELBO</text>

  <rect x="1302" y="220" width="420" height="190" class="box guard"/>
  <text x="1332" y="270" class="box-title">Select safe thresholds</text>
  <text x="1332" y="320" class="box-body">Tune override gate by LOQDO</text>
  <text x="1332" y="382" class="note">Accept only non-harmful evidence</text>

  <path d="M396 315 H458" class="arrow"/>
  <path d="M798 315 H860" class="arrow"/>
  <path d="M1230 315 H1292" class="arrow"/>

  <rect x="96" y="640" width="300" height="190" class="box source"/>
  <text x="126" y="690" class="box-title">New query q</text>
  <text x="126" y="740" class="box-body">Unseen target sample</text>
  <text x="126" y="802" class="small">Before utility evaluation</text>

  <rect x="468" y="640" width="330" height="190" class="box ae"/>
  <text x="498" y="690" class="box-title">Pick AE anchor</text>
  <text x="498" y="740" class="box-body">Choose most familiar expert</text>
  <text x="498" y="802" class="small">This is proxy compatibility</text>

  <rect x="870" y="640" width="360" height="190" class="box route"/>
  <text x="900" y="690" class="box-title">Safe override gate</text>
  <text x="900" y="740" class="box-body">Switch only if gain > threshold</text>
  <text x="900" y="802" class="small">Otherwise keep AE anchor</text>

  <rect x="1302" y="640" width="420" height="190" class="box eval"/>
  <text x="1332" y="690" class="box-title">Held-out utility evaluation</text>
  <text x="1332" y="740" class="box-body">Measure selected expert by NELBO</text>
  <text x="1332" y="802" class="small">Report top-1, Spearman, oracle gap</text>

  <path d="M396 735 H458" class="arrow"/>
  <path d="M798 735 H860" class="arrow"/>
  <path d="M1230 735 H1292" class="arrow"/>

  <path d="M1512 410 C1512 500 1050 520 1050 630" class="thin-arrow"/>
  <text x="1158" y="506" class="tiny">calibrated threshold reused at query time</text>

  <rect x="96" y="900" width="1626" height="92" class="box"/>
  <text x="126" y="942" class="box-title">Claim boundary</text>
  <text x="126" y="974" class="box-body">AE fit is not ground-truth compatibility. The thesis claim comes only after held-out NELBO utility evaluation.</text>
</svg>
