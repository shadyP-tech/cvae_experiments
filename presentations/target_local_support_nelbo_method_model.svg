<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">Target-local support-NELBO method model</title>
  <desc id="desc">Compact slide insert for direct support-set NELBO routing: split target support from held-out evaluation, score frozen source experts on support NELBO, select the lowest support NELBO expert, then evaluate the frozen decision on disjoint held-out target samples.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e15759"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .label { font: 700 20px Arial, Helvetica, sans-serif; fill: #111827; }
      .body { font: 400 16px Arial, Helvetica, sans-serif; fill: #374151; }
      .small { font: 400 13px Arial, Helvetica, sans-serif; fill: #6b7280; }
      .tiny { font: 400 12px Arial, Helvetica, sans-serif; fill: #6b7280; }
      .formula { font: 700 16px Arial, Helvetica, sans-serif; fill: #111827; }
      .panel { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.7; rx: 14; }
      .support { fill: #fff4e6; stroke: #f28e2b; stroke-width: 2; rx: 12; }
      .eval { fill: #fdecec; stroke: #e15759; stroke-width: 2; rx: 12; }
      .source { fill: #eff6ff; stroke: #4e79a7; stroke-width: 2; rx: 12; }
      .score { fill: #eef8ed; stroke: #54a24b; stroke-width: 2; rx: 12; }
      .decision { fill: #f9fafb; stroke: #111827; stroke-width: 2; rx: 12; }
      .guard { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; rx: 12; }
      .arrow { stroke: #111827; stroke-width: 3; fill: none; marker-end: url(#arrow-dark); }
      .soft-arrow { stroke: #6b7280; stroke-width: 2.5; fill: none; marker-end: url(#arrow-dark); }
      .eval-arrow { stroke: #e15759; stroke-width: 2.2; fill: none; marker-end: url(#arrow-red); }
      .bar-bg { fill: #e5e7eb; rx: 6; }
      .bar { fill: #54a24b; rx: 6; }
      .bar-muted { fill: #9ca3af; rx: 6; }
      .selected-ring { fill: none; stroke: #54a24b; stroke-width: 3; rx: 10; }
      .divider { stroke: #e5e7eb; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="480"/>

  <rect x="42" y="24" width="250" height="320" class="panel"/>
  <text x="64" y="60" class="label">Held-out target fold T</text>
  <text x="64" y="85" class="small">Split before routing</text>

  <rect x="66" y="112" width="202" height="82" class="support"/>
  <text x="88" y="144" class="label">Support S_T</text>
  <text x="88" y="170" class="body">unlabeled, small k</text>
  <text x="88" y="188" class="small">allowed for routing</text>

  <line x1="66" y1="218" x2="268" y2="218" class="divider"/>

  <rect x="66" y="240" width="202" height="82" class="eval"/>
  <text x="88" y="272" class="label">Evaluation E_T</text>
  <text x="88" y="298" class="body">held out</text>
  <text x="88" y="316" class="small">not visible to router</text>

  <rect x="342" y="24" width="230" height="320" class="panel"/>
  <text x="364" y="60" class="label">Frozen source experts</text>
  <text x="364" y="85" class="small">independently trained on source domains</text>

  <rect x="374" y="119" width="166" height="40" class="source"/>
  <text x="396" y="145" class="body">Expert e1</text>
  <rect x="374" y="171" width="166" height="40" class="source"/>
  <text x="396" y="197" class="body">Expert e2</text>
  <rect x="374" y="223" width="166" height="40" class="source"/>
  <text x="396" y="249" class="body">Expert e3</text>
  <rect x="374" y="275" width="166" height="40" class="source"/>
  <text x="396" y="301" class="body">Expert e4</text>

  <rect x="622" y="24" width="330" height="320" class="score"/>
  <text x="646" y="60" class="label">Score support NELBO</text>
  <text x="646" y="85" class="small">Lower NELBO on S_T means higher target-local utility</text>

  <text x="652" y="125" class="small">candidate</text>
  <text x="874" y="125" class="small">support NELBO</text>
  <line x1="646" y1="137" x2="926" y2="137" class="divider"/>

  <text x="656" y="168" class="body">e1</text>
  <rect x="707" y="151" width="185" height="16" class="bar-bg"/>
  <rect x="707" y="151" width="145" height="16" class="bar-muted"/>
  <text x="874" y="168" class="small">mid</text>

  <rect x="646" y="184" width="280" height="46" class="selected-ring"/>
  <text x="656" y="213" class="body">e2</text>
  <rect x="707" y="197" width="185" height="16" class="bar-bg"/>
  <rect x="707" y="197" width="74" height="16" class="bar"/>
  <text x="874" y="213" class="small">lowest</text>

  <text x="656" y="258" class="body">e3</text>
  <rect x="707" y="241" width="185" height="16" class="bar-bg"/>
  <rect x="707" y="241" width="168" height="16" class="bar-muted"/>
  <text x="874" y="258" class="small">high</text>

  <text x="656" y="303" class="body">e4</text>
  <rect x="707" y="286" width="185" height="16" class="bar-bg"/>
  <rect x="707" y="286" width="112" height="16" class="bar-muted"/>
  <text x="874" y="303" class="small">mid</text>

  <text x="646" y="329" class="small">All scores are computed before any E_T NELBO is measured.</text>

  <rect x="1018" y="24" width="230" height="320" class="decision"/>
  <text x="1040" y="60" class="label">Routing decision</text>
  <text x="1040" y="100" class="formula">e* = argmin_e</text>
  <text x="1040" y="124" class="formula">mean NELBO(S_T | e)</text>
  <line x1="1040" y1="150" x2="1226" y2="150" class="divider"/>
  <text x="1040" y="186" class="body">Select e2</text>
  <text x="1040" y="213" class="body">Freeze the route</text>
  <text x="1040" y="253" class="small">No expert update</text>
  <text x="1040" y="274" class="small">No target labels</text>
  <text x="1040" y="295" class="small">No target expert in pool</text>

  <rect x="1312" y="24" width="248" height="320" class="eval"/>
  <text x="1334" y="60" class="label">Utility evaluation</text>
  <text x="1334" y="92" class="body">Only after e* is fixed</text>
  <line x1="1334" y1="118" x2="1538" y2="118" class="divider"/>
  <text x="1334" y="154" class="body">Score E_T with e*</text>
  <text x="1334" y="181" class="body">Measure held-out NELBO</text>
  <text x="1334" y="229" class="small">Report:</text>
  <text x="1352" y="255" class="small">top-1 oracle hit</text>
  <text x="1352" y="276" class="small">Spearman rank</text>
  <text x="1352" y="297" class="small">oracle gap %</text>

  <path d="M268 153 C305 153 307 139 342 139" class="soft-arrow"/>
  <text x="293" y="122" class="tiny">S_T only</text>
  <path d="M572 191 C596 191 598 191 622 191" class="arrow"/>
  <path d="M952 191 C986 191 990 191 1018 191" class="arrow"/>
  <path d="M1248 191 C1280 191 1284 191 1312 191" class="arrow"/>

  <path d="M167 322 V362 H1436 V344" class="eval-arrow"/>
  <text x="1030" y="376" class="tiny">E_T enters only after route is frozen</text>

  <rect x="42" y="384" width="348" height="58" class="guard"/>
  <text x="64" y="408" class="label">Support/eval disjoint</text>
  <text x="64" y="430" class="small">S_T estimates; E_T judges.</text>

  <rect x="416" y="384" width="348" height="58" class="guard"/>
  <text x="438" y="408" class="label">Experts stay frozen</text>
  <text x="438" y="430" class="small">Support NELBO does not update checkpoints.</text>

  <rect x="790" y="384" width="348" height="58" class="guard"/>
  <text x="812" y="408" class="label">Candidate pool excludes target</text>
  <text x="812" y="430" class="small">No target expert leakage.</text>

  <rect x="1164" y="384" width="396" height="58" class="guard"/>
  <text x="1186" y="408" class="label">Claim boundary</text>
  <text x="1186" y="430" class="small">Compatibility = -NELBO on support; thesis utility = held-out NELBO.</text>
</svg>
