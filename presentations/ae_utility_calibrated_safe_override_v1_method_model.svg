<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">AE utility calibrated safe override method model</title>
  <desc id="desc">Compact slide insert for ae_utility_calibrated_safe_override_v1: train a source-only ridge delta utility calibrator from AE proxy features and source-inner NELBO deltas, select safe override thresholds by source-inner validation, route target queries without target support, then evaluate the fixed expert choice using held-out target NELBO.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e15759"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .label { font: 700 20px Arial, Helvetica, sans-serif; fill: #111827; }
      .body { font: 400 16px Arial, Helvetica, sans-serif; fill: #374151; }
      .small { font: 400 13px Arial, Helvetica, sans-serif; fill: #6b7280; }
      .tiny { font: 400 12px Arial, Helvetica, sans-serif; fill: #6b7280; }
      .formula { font: 700 15px Arial, Helvetica, sans-serif; fill: #111827; }
      .panel { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.7; rx: 14; }
      .source { fill: #eff6ff; stroke: #4e79a7; stroke-width: 2; rx: 12; }
      .model { fill: #fff4e6; stroke: #f28e2b; stroke-width: 2; rx: 12; }
      .gate { fill: #eef8ed; stroke: #54a24b; stroke-width: 2; rx: 12; }
      .decision { fill: #f9fafb; stroke: #111827; stroke-width: 2; rx: 12; }
      .eval { fill: #fdecec; stroke: #e15759; stroke-width: 2; rx: 12; }
      .guard { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; rx: 12; }
      .arrow { stroke: #111827; stroke-width: 3; fill: none; marker-end: url(#arrow-dark); }
      .soft-arrow { stroke: #6b7280; stroke-width: 2.5; fill: none; marker-end: url(#arrow-dark); }
      .eval-arrow { stroke: #e15759; stroke-width: 2.2; fill: none; marker-end: url(#arrow-red); }
      .blocked { stroke: #e15759; stroke-width: 2.2; stroke-dasharray: 8 6; fill: none; }
      .divider { stroke: #e5e7eb; stroke-width: 1.5; }
      .chip { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.3; rx: 9; }
      .bar-bg { fill: #e5e7eb; rx: 6; }
      .bar { fill: #54a24b; rx: 6; }
      .bar-muted { fill: #9ca3af; rx: 6; }
      .selected-ring { fill: none; stroke: #54a24b; stroke-width: 3; rx: 10; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="480"/>

  <rect x="42" y="24" width="260" height="320" class="panel"/>
  <text x="64" y="60" class="label">Source AE proxy</text>
  <text x="64" y="85" class="small">support-free AE familiarity signal</text>

  <rect x="66" y="112" width="212" height="66" class="source"/>
  <text x="88" y="142" class="label">Source AEs</text>
  <text x="88" y="166" class="body">trained on source folds</text>

  <line x1="66" y1="204" x2="278" y2="204" class="divider"/>
  <text x="66" y="231" class="small">source-val z-score reconstruction error</text>

  <text x="76" y="268" class="body">e1</text>
  <rect x="116" y="252" width="124" height="15" class="bar-bg"/>
  <rect x="116" y="252" width="88" height="15" class="bar-muted"/>

  <rect x="66" y="282" width="196" height="42" class="selected-ring"/>
  <text x="76" y="308" class="body">e2</text>
  <rect x="116" y="293" width="124" height="15" class="bar-bg"/>
  <rect x="116" y="293" width="48" height="15" class="bar"/>
  <text x="210" y="310" class="small">anchor</text>

  <rect x="352" y="24" width="270" height="320" class="model"/>
  <text x="374" y="60" class="label">Utility calibrator</text>
  <text x="374" y="85" class="small">ridge-delta fit on source-inner utility</text>

  <rect x="384" y="120" width="206" height="52" class="chip"/>
  <text x="406" y="143" class="body">features: AE core</text>
  <text x="406" y="162" class="small">+ AE quality</text>

  <rect x="384" y="192" width="206" height="52" class="chip"/>
  <text x="406" y="215" class="body">target: utility delta</text>
  <text x="406" y="234" class="small">vs AE argmin anchor</text>

  <line x1="384" y1="270" x2="590" y2="270" class="divider"/>
  <text x="384" y="300" class="formula">Predict gain: Delta U(e)</text>
  <text x="384" y="322" class="small">source-inner NELBO only</text>

  <rect x="672" y="24" width="290" height="320" class="gate"/>
  <text x="694" y="60" class="label">Safe override gate</text>
  <text x="694" y="85" class="small">source-inner thresholds select adoption</text>

  <rect x="704" y="118" width="226" height="62" class="chip"/>
  <text x="726" y="144" class="formula">fallback = AE argmin z-score</text>
  <text x="726" y="165" class="small">inf threshold returns exact fallback</text>

  <rect x="704" y="200" width="226" height="62" class="selected-ring"/>
  <text x="726" y="226" class="formula">Delta + margin gates</text>
  <text x="726" y="247" class="small">noninferiority then gap</text>

  <line x1="704" y1="282" x2="930" y2="282" class="divider"/>
  <text x="704" y="309" class="small">Switch only when predicted gain</text>
  <text x="704" y="329" class="small">clears the selected safe threshold.</text>

  <rect x="1012" y="24" width="270" height="320" class="decision"/>
  <text x="1034" y="60" class="label">Target query routing</text>
  <text x="1034" y="85" class="small">no target support, labels, or stats</text>

  <rect x="1044" y="120" width="206" height="52" class="source"/>
  <text x="1066" y="152" class="body">new target query q</text>

  <text x="1034" y="206" class="body">1. score source AEs</text>
  <text x="1034" y="234" class="body">2. start from AE anchor</text>
  <text x="1034" y="262" class="body">3. apply safe override</text>
  <line x1="1034" y1="286" x2="1258" y2="286" class="divider"/>
  <text x="1034" y="317" class="formula">select e* before evaluation</text>

  <rect x="1332" y="24" width="228" height="320" class="eval"/>
  <text x="1354" y="60" class="label">Utility evaluation</text>
  <text x="1354" y="92" class="body">Only after e* is fixed</text>
  <line x1="1354" y1="118" x2="1538" y2="118" class="divider"/>
  <text x="1354" y="151" class="body">Score true NELBO</text>
  <text x="1354" y="176" class="body">on held-out target</text>
  <text x="1354" y="219" class="small">Camelyon17 selected:</text>
  <text x="1372" y="244" class="small">top-1 = 0.629</text>
  <text x="1372" y="265" class="small">Spearman = 0.629</text>
  <text x="1372" y="286" class="small">oracle gap = 3.48%</text>
  <text x="1372" y="307" class="small">override precision = 0.778</text>

  <path d="M278 294 C318 294 318 217 352 217" class="soft-arrow"/>
  <path d="M622 184 C646 184 648 184 672 184" class="arrow"/>
  <path d="M962 184 C990 184 992 184 1012 184" class="arrow"/>
  <path d="M1282 184 C1308 184 1310 184 1332 184" class="arrow"/>

  <path d="M1446 344 V360 H1138 V344" class="eval-arrow"/>
  <text x="1159" y="374" class="tiny">held-out NELBO judges the fixed route only</text>

  <path d="M1446 344 V362 H486 V344" class="blocked"/>
  <circle cx="486" cy="344" r="11" fill="#ffffff" stroke="#e15759" stroke-width="2.4"/>
  <line x1="480" y1="338" x2="492" y2="350" stroke="#e15759" stroke-width="2.4"/>
  <line x1="492" y1="338" x2="480" y2="350" stroke="#e15759" stroke-width="2.4"/>
  <text x="530" y="355" class="tiny">blocked: target eval NELBO cannot train, tune, or select thresholds</text>

  <rect x="42" y="384" width="348" height="58" class="guard"/>
  <text x="64" y="408" class="label">Target-support-free</text>
  <text x="64" y="430" class="small">No target support, labels, or target stats.</text>

  <rect x="416" y="384" width="348" height="58" class="guard"/>
  <text x="438" y="408" class="label">Source-only calibration</text>
  <text x="438" y="430" class="small">AE z-scores and thresholds fit on source folds.</text>

  <rect x="790" y="384" width="348" height="58" class="guard"/>
  <text x="812" y="408" class="label">Target expert excluded</text>
  <text x="812" y="430" class="small">Target AE and CVAE are omitted from routing.</text>

  <rect x="1164" y="384" width="396" height="58" class="guard"/>
  <text x="1186" y="408" class="label">Claim boundary</text>
  <text x="1186" y="430" class="small">AE reconstruction is proxy; final utility is held-out NELBO.</text>
</svg>
