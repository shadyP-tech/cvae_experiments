seed: 42

experiment:
  dataset_name: breakhis
  name: learned_utility_source_reliability_v1
  mode: learned_utility_routing
  default_seeds: [42, 43, 44]

data:
  dataset_type: breakhis
  root: data/BreakHis
  image_extensions: [".png", ".jpg", ".jpeg", ".tif", ".tiff", ".bmp"]
  magnifications: [40, 100, 200, 400]
  max_samples_per_domain: 500
  split:
    train: 0.70
    val: 0.15
    test: 0.15
  require_patient_ids: false
  dataset_domain_semantics: breakhis_magnification
  legacy_domain_field_alias: magnification

features:
  image_size: 224
  extraction_batch_size: 16
  backbone_type: dinov2_vitb14
  feature_extractor_name: dinov2_vitb14
  feature_extractor_checkpoint: facebook/dinov2-base
  feature_extractor_layer: final_norm_cls
  embedding_pooling: cls_token
  embedding_dim: 768

model:
  hidden_dim: 256
  latent_dim: 16

training:
  batch_size: 128
  learning_rate: 0.001
  epochs: 25
  patience: 5

routing:
  strategy: categorical_exact
  tau: 1.0
  temperature: 1.0

learned_utility:
  split_protocol: loqdo_query_domain
  query_domain_field: magnification
  splits: [test]
  predictors: [pairwise_ranker]

  autoencoder_proxy:
    enabled: true
    hidden_dim: 256
    latent_dim: 32
    learning_rate: 1.0e-3
    epochs: 25
    patience: 5
    batch_size: 512
    score_normalization: source_val_zscore
    score_normalization_eps: 1.0e-6
    margin_threshold: 0.0
    run_diagnostics: true
    ae_first_routing:
      enabled: false
    utility_calibrator:
      enabled: false

  source_reliability:
    enabled: true
    primary_method: source_subdomain_reliability_selected_router_v1
    fallback_method: ae_argmin_zscore
    candidate_methods: [pairwise_ranker_ae_only, pairwise_ranker_ae_combined]
    group_key_candidates: [patient_id, slide_id, case_id]
    pseudo_domain_strategy: per_parent_group_embedding_kmeans
    n_pseudo_domains_per_source: 4
    min_pseudo_domains_per_source: 2
    min_groups_per_pseudo_domain: 3
    min_samples_per_pseudo_domain: 25
    min_candidate_pool_size: 2
    pca_dim: 16
    kmeans_iterations: 50
    reliability_selection:
      aggregation_unit: parent_domain_x_pseudo_domain_macro
      min_source_inner_units: 6
      min_parent_domains: 2
      min_units_per_parent_for_gain_share: 2
      max_top1_drop_abs: 0.02
      max_spearman_drop_abs: 0.03
      max_gap_pct_degradation: 1.0
      max_worst_unit_gap_degradation: 2.0
      min_gap_reduction_vs_fallback: 0.0
      min_positive_unit_rate: 0.60
      min_positive_parent_rate: 0.50
      max_positive_gain_share: 0.60
      require_parent_holdout_guard: true

  predictor_params:
    pairwise_ranker:
      hidden_dim: 128
      epochs: 40
      lr: 1.0e-3
      batch_size: 2048
      device: auto
      loss_type: hinge
      margin: 1.0
      near_tie_delta: 0.01
      hard_pair_fraction: 0.5
      random_pair_fraction: 0.5
      max_pairs_per_sample: 12
      max_pairs_per_domain: 5000
      run_ablations: true

  target:
    name: nelbo
    normalization: per_query_domain_zscore
    normalization_stats_source: train_fold_only
    eval_scale: raw_nelbo

  pair_features:
    include_sample_embedding: true
    expert_id_encoding: one_hot
    include_metadata_features: true
    include_domain_stats: false

  residual_routing:
    enabled: false

  support_response_routing:
    enabled: false

  scoring:
    granularity: sample_expert_pair
    enforce_full_expert_scoring: true
    pair_batch_size: 4096

  latent_comparator:
    primary: wasserstein
    diagnostics: [centroid, gaussian_kl]

  hybrid_scoring:
    enabled: false
    alphas: [0.0, 1.0]
    latent_metric: wasserstein
    normalization_primary: per_query_zscore
    normalization_sensitivity: per_query_minmax
    run_sensitivity: false
    tie_policy: stable_expert_index

  compatibility_research:
    floors:
      random_rank_floor: true
      random_score_floor: true
    permutation_tests:
      expert_label_permutation: true
      metadata_permutation: true
      repeats: 200
    diagnostics:
      save_distribution_plots: true
    gate:
      uplift_reference_method: metadata_routing
